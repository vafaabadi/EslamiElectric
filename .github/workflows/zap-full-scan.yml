# OWASP ZAP Full (Active) Scan — runs nightly on the default branch.
#
# Unlike the baseline scan (passive only, fast), the full scan actively probes
# for vulnerabilities. It is intentionally kept separate from CI because:
#   • It takes 10–60+ minutes to complete
#   • Active probing generates real traffic and can trigger rate limits or alerts
#   • Results are noisy; review them manually rather than blocking PRs
#
# Findings are uploaded as a workflow artifact (zap-full-report).
# Set fail_action: true below if you want the job to fail on any alert.

name: Security (ZAP Full Scan – Nightly)

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every night (default branch only)
  workflow_dispatch:       # also triggerable manually from the Actions tab

concurrency:
  group: zap-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-full:
    name: OWASP ZAP (full active scan)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server for ZAP
        env:
          CI: true
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          node server.js &
          echo $! > "${RUNNER_TEMP}/app.pid"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:3000/en/"; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server did not become ready on :3000"
          exit 1

      # ZAP runs in Docker; use default bridge host IP so the container can
      # reach the runner's Node server (server.js listens on 0.0.0.0).
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://172.17.0.1:3000/en/'
          allow_issue_writing: false
          fail_action: false

      - name: Stop server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/app.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/app.pid")" 2>/dev/null || true
          fi
