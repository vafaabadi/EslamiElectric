# Snyk: dependency & supply-chain issues (SCA). Set repo secret SNYK_TOKEN (snyk.io → Account → Auth).
# OWASP ZAP Baseline: dynamic scan (DAST) against a running app — not the same as CodeQL/npm audit.
#
# Both jobs upload SARIF to GitHub Security → Code Scanning when the repo has
# Code Scanning enabled (free for public repos; requires GitHub Advanced Security for private).
# If Code Scanning is not yet enabled the upload step is skipped gracefully (continue-on-error).
#
name: Security (Snyk + ZAP)

on:
  push:
  workflow_dispatch:

concurrency:
  group: security-sz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk:
    name: Snyk (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write   # needed for SARIF upload to Code Scanning
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snyk test (emit SARIF)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@v1
        continue-on-error: true   # findings are surfaced via SARIF; don't block the build here
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to GitHub Security
        if: env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
        continue-on-error: true   # graceful if Code Scanning is not yet enabled
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif
          category: snyk-sca

      - name: Skip Snyk (no SNYK_TOKEN)
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::notice::Add repository secret SNYK_TOKEN to enable Snyk SCA."
          echo "Create a free account at https://snyk.io → Account Settings → API Token."

  zap:
    name: OWASP ZAP (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # needed for SARIF upload to Code Scanning

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start server for ZAP
        env:
          CI: true
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          node server.js &
          echo $! > "${RUNNER_TEMP}/app.pid"
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:3000/en/"; then
              echo "Server ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server did not become ready on :3000"
          exit 1

      # ZAP runs in Docker; use default bridge host IP so the container can reach the runner's Node server (see server.js listen 0.0.0.0).
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://172.17.0.1:3000/en/'
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP SARIF to GitHub Security
        if: always() && hashFiles('report_sarif.json') != ''
        continue-on-error: true   # graceful if Code Scanning is not yet enabled
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: report_sarif.json
          category: zap-baseline

      - name: Upload ZAP HTML report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report-${{ github.run_number }}
          path: |
            report_html.html
            report_json.json
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/app.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/app.pid")" 2>/dev/null || true
          fi
