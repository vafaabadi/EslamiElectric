# SonarCloud SAST — static analysis for bugs, code smells, and security vulnerabilities.
#
# Setup (one-time, ~5 minutes):
#   1. Go to https://sonarcloud.io → Log in with GitHub → Import this repository.
#   2. In SonarCloud: My Account → Security → Generate token.
#   3. Add that token as a GitHub Actions secret: SONAR_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret)
#   4. Confirm the projectKey and organization in sonar-project.properties match
#      what SonarCloud shows for this project.
#
# Results appear in:
#   • SonarCloud dashboard (detailed issues, security hotspots, coverage trends)
#   • GitHub PR decorations (inline comments on changed lines)
#   • GitHub Security → Code Scanning (via the sonarcloud/sonarcloud-github-action SARIF upload)

name: SonarCloud (SAST)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud analysis
    # Skip forks (no access to SONAR_TOKEN from fork PRs)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # needed for PR decoration

    steps:
      - name: Checkout (full history for blame & new-code detection)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # PR decoration
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
