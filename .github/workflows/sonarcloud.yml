# SonarCloud SAST — static analysis for bugs, code smells, and security vulnerabilities.
#
# ── One-time setup (~5 minutes) ──────────────────────────────────────────────
#   1. Go to https://sonarcloud.io → Log in with GitHub → import EslamiElectric.
#   2. IMPORTANT — disable Automatic Analysis:
#        SonarCloud project → Administration → Analysis Method
#        → switch to "CI-based analysis" (turn Automatic Analysis OFF).
#        Without this step the scan fails with exit code 3.
#   3. SonarCloud: My Account → Security → Generate token.
#   4. GitHub: Settings → Secrets → Actions → add secret SONAR_TOKEN.
#   5. Confirm sonar-project.properties projectKey + organization match SonarCloud.
#
# ── Results ──────────────────────────────────────────────────────────────────
#   • SonarCloud dashboard  — detailed issues, security hotspots, coverage trends
#   • GitHub PR decorations — inline comments on changed lines

name: SonarCloud (SAST)

# DISABLED from automatic runs until setup is complete (manual-only via workflow_dispatch).
# To re-enable, restore:
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#
# One-time setup still required:
#   • SonarCloud project → Administration → Analysis Method → disable Automatic Analysis
#   • Add SONAR_TOKEN secret to GitHub repo

on:
  workflow_dispatch:   # manual only until Automatic Analysis is disabled in SonarCloud

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # needed for PR decoration

    steps:
      - name: Checkout (full history for blame & new-code detection)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Uses the current recommended action (sonarcloud-github-action delegates to this internally).
      # continue-on-error: true lets the build stay green while you complete the one-time
      # setup above (disable Automatic Analysis + add SONAR_TOKEN).  Remove it once the
      # scan is passing consistently.
      - name: SonarCloud Scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.1.0   # v5 had CVE-2025-59844 + CVE-2025-58178
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
