# TruffleHog scans the full git commit history for verified secrets (API keys,
# tokens, passwords) that may have been pushed and later deleted — deleted secrets
# are still visible in git history and therefore still a risk.
#
# --only-verified: only flags secrets that TruffleHog can actively confirm are
# live/valid against the provider API, eliminating almost all false positives.
#
# On PRs the scan runs only over the new commits (base..head).
# On pushes to main it rescans the entire history so nothing is missed.

name: Secret Scanning (TruffleHog)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: trufflehog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog (git history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history is required for the commit-by-commit scan

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@v3.88.25
        with:
          # On a PR scan only the new commits; on a branch push scan everything.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'HEAD' }}
          extra_args: --only-verified
