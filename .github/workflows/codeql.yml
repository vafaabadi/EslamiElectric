# CodeQL static analysis for JavaScript and TypeScript.
#
# ── One-time setup to see results in GitHub Security tab ─────────────────────
#   Repo → Settings → Code security and analysis → Code scanning → Enable.
#   Free for public repos. Private repos require GitHub Advanced Security.
#
# This repo is private. GitHub Code Scanning (SARIF upload) requires GitHub
# Advanced Security, which is a paid feature for private repos. CodeQL still
# runs the full analysis — findings are visible in the job log — but results
# cannot be pushed to the GitHub Security tab without that plan upgrade.
# upload: never prevents the action from trying (and failing) to upload.

name: CodeQL

on:
  push:
  schedule:
    # Weekly — catches new queries / baseline drift even with low commit volume
    - cron: '24 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
