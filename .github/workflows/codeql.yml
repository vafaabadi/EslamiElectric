# CodeQL static analysis for JavaScript and TypeScript.
#
# ── One-time setup to see results in GitHub Security tab ─────────────────────
#   Repo → Settings → Code security and analysis → Code scanning → Enable.
#   Free for public repos. Private repos require GitHub Advanced Security.
#
# Until Code Scanning is enabled the analyze step runs and produces results
# locally but the SARIF upload is skipped (continue-on-error keeps CI green).

name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Weekly — catches new queries / baseline drift even with low commit volume
    - cron: '24 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # continue-on-error: true keeps CI green if Code Scanning is not yet enabled
      # in repo Settings. Remove it after enabling Code Scanning.
      - name: Perform CodeQL Analysis
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
