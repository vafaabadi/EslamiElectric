# CodeQL static analysis for JavaScript and TypeScript.
#
# To show results under Security → Code scanning alerts:
#   Repo → Settings → Code security and analysis → Code scanning → set up / enable.
# Private org repos may need GitHub Advanced Security. See:
#   https://docs.github.com/en/code-security/code-scanning/introduction-to-code-scanning/about-code-scanning
#
# upload is "never" until Code Scanning is enabled (otherwise analyze fails trying to upload SARIF).
# After you enable Code scanning, remove the `upload: never` line below (default uploads to GitHub).

name: CodeQL

on:
  push:
  pull_request:
  schedule:
    # Weekly — catches new queries / baseline drift even with low commit volume
    - cron: '24 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
          # Remove this line after enabling Code scanning in repo Settings (see file comment at top).
          upload: never
