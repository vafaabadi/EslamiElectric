# Runs on every push to any branch (not on pull_request — saves Actions minutes).
# Configure repository secrets (Settings → Secrets and variables → Actions) so the app can boot in CI:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, JWT_SECRET
#   E2E_TEST_USER_EMAIL, E2E_TEST_USER_PASSWORD (Playwright shop login; optional, tests skip if unset)
#   E2E_ADMIN_EMAIL, E2E_ADMIN_PASSWORD (Playwright admin catalog flows; user must have public.users.is_admin = true; optional)
# (same values as a working local .env — use a dev/test Supabase project if you prefer.)
#
# Security job: npm audit only (no secrets). Snyk + OWASP ZAP: see security-snyk-zap.yml. Dependabot + CodeQL: repo Settings.
# Security job: dependency audit only (no secrets). Enable Dependabot + CodeQL in repo Settings for more coverage.

name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail CI on high/critical CVEs in the lockfile; moderate/low still reported but do not fail the job.
      - name: npm audit
        run: npm audit --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Playwright tests
        run: npm run typecheck:e2e

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        env:
          CI: true
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
          E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
