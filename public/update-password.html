<!DOCTYPE html>
<html lang="en">
<head>
  <!--SERVER_PUBLIC_CONFIG-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/auth-nav-sync.js"></script>
  <title>Update Password - Eslami Electric</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script src="js/locale-bootstrap.js"></script>
  <script src="js/price-format.js"></script>
  <script src="js/locale-init.js"></script>
  <script src="js/site-footer-i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto">
        <a href="login.html" id="nav-login" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Log In</a>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors">فارسی</button>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js"></script>

  <main class="flex-grow max-w-md w-full mx-auto px-4 py-8">
    <h2 id="form-title" class="text-2xl font-bold text-slate-800 mb-6">Update Password</h2>

    <div id="no-session" class="hidden bg-white rounded-xl shadow-md p-6 text-center text-slate-600">
      <p id="no-session-msg" class="mb-4">This page is for setting a new password after clicking the link from your email. If you arrived here by mistake, go back to login.</p>
      <a href="login.html" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400">Log In</a>
    </div>

    <form id="update-form" class="hidden bg-white rounded-xl shadow-md p-6 space-y-4">
      <div>
        <label id="label-password" for="password" class="block text-sm font-medium text-slate-700 mb-1">New password *</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      <div>
        <label id="label-confirm" for="confirm" class="block text-sm font-medium text-slate-700 mb-1">Confirm new password *</label>
        <input type="password" id="confirm" required minlength="8" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      <button id="submit-btn" type="submit" class="w-full bg-amber-500 text-slate-900 font-semibold py-2 rounded hover:bg-amber-400 transition-colors">
        Update Password
      </button>
      <p id="update-message" class="text-sm mt-2"></p>
    </form>

    <div id="success-box" class="hidden bg-white rounded-xl shadow-md p-6 text-center">
      <p id="success-msg" class="text-emerald-600 font-medium mb-4">Your password has been updated.</p>
      <a href="login.html" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400">Log In</a>
    </div>

    <p class="mt-6 text-center text-slate-600 text-sm">
      <a href="login.html" class="text-amber-600 font-medium hover:underline">Back to Log In</a>
    </p>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>

  <script>
    runWhenLocaleReady(function () {
    const translations = {
      en: {
        siteTitle: 'Eslami Electric',
        siteSubtitle: 'Quality electrical supplies',
        formTitle: 'Update Password',
        labelPassword: 'New password *',
        labelConfirm: 'Confirm new password *',
        submitBtn: 'Update Password',
        successMsg: 'Your password has been updated.',
        noSessionMsg: "This page is for setting a new password after clicking the link from your email. If you arrived here by mistake, go back to login.",
        backToLogin: 'Back to Log In',
        errorMismatch: 'Passwords do not match.',
        errorFailed: 'Failed to update password. Please try again or request a new link.',
        errorNoConfig: 'Password update is not configured.'
      },
      fa: {
        siteTitle: 'الکتریکی اسلامی',
        siteSubtitle: 'تجهیزات برقی با کیفیت',
        formTitle: 'به‌روزرسانی رمز عبور',
        labelPassword: 'رمز عبور جدید *',
        labelConfirm: 'تکرار رمز عبور جدید *',
        submitBtn: 'به‌روزرسانی رمز عبور',
        successMsg: 'رمز عبور شما به‌روزرسانی شد.',
        noSessionMsg: 'این صفحه برای تنظیم رمز عبور جدید پس از کلیک روی لینک ایمیل است. در صورت ورود اشتباه، به صفحه ورود برگردید.',
        backToLogin: 'بازگشت به ورود',
        errorMismatch: 'رمزهای عبور یکسان نیستند.',
        errorFailed: 'به‌روزرسانی رمز عبور ناموفق بود. دوباره تلاش کنید یا لینک جدید درخواست کنید.',
        errorNoConfig: 'به‌روزرسانی رمز عبور پیکربندی نشده است.'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';
    let supabaseClient = null;

    const updateForm = document.getElementById('update-form');
    const noSession = document.getElementById('no-session');
    const successBox = document.getElementById('success-box');
    const updateMessage = document.getElementById('update-message');
    const submitBtn = document.getElementById('submit-btn');

    function applyPageLanguage() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('site-subtitle').textContent = t.siteSubtitle;
      document.getElementById('form-title').textContent = t.formTitle;
      document.getElementById('label-password').textContent = t.labelPassword;
      document.getElementById('label-confirm').textContent = t.labelConfirm;
      document.getElementById('submit-btn').textContent = t.submitBtn;
      document.getElementById('success-msg').textContent = t.successMsg;
      document.getElementById('no-session-msg').textContent = t.noSessionMsg;
      document.querySelector('main .mt-6 a').textContent = t.backToLogin;
      document.getElementById('nav-login').textContent = currentLang === 'fa' ? 'ورود' : 'Log In';
      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      if (typeof applyFooterI18n === 'function') applyFooterI18n();
    }

    document.getElementById('lang-en').addEventListener('click', function() {
      currentLang = 'en';
      localStorage.setItem('lang', 'en');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });
    document.getElementById('lang-fa').addEventListener('click', function() {
      currentLang = 'fa';
      localStorage.setItem('lang', 'fa');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });

    async function init() {
      applyPageLanguage();
      function readServerPublicConfig() {
        const el = document.getElementById('server-public-config');
        if (!el || !el.textContent) return null;
        try { return JSON.parse(el.textContent); } catch (e) { return null; }
      }
      const config = readServerPublicConfig();
      if (!config || !config.supabaseUrl || !config.supabaseAnonKey) {
        noSession.querySelector('p').textContent = translations[currentLang].errorNoConfig;
        noSession.classList.remove('hidden');
        return;
      }

      supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
      if (typeof supabaseClient.auth.initialize === 'function') {
        await supabaseClient.auth.initialize();
      }
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (!session) {
        noSession.classList.remove('hidden');
        return;
      }

      noSession.classList.add('hidden');
      updateForm.classList.remove('hidden');
    }

    updateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      updateMessage.textContent = '';
      const t = translations[currentLang];
      const password = document.getElementById('password').value;
      const confirmVal = document.getElementById('confirm').value;

      if (password !== confirmVal) {
        updateMessage.className = 'text-sm mt-2 text-red-600';
        updateMessage.textContent = t.errorMismatch;
        return;
      }

      if (!supabaseClient) {
        updateMessage.className = 'text-sm mt-2 text-red-600';
        updateMessage.textContent = t.errorNoConfig;
        return;
      }

      try {
        submitBtn.disabled = true;
        const { error } = await supabaseClient.auth.updateUser({ password });

        if (error) {
          updateMessage.className = 'text-sm mt-2 text-red-600';
          updateMessage.textContent = error.message || t.errorFailed;
          return;
        }

        updateForm.classList.add('hidden');
        successBox.classList.remove('hidden');
      } catch (err) {
        updateMessage.className = 'text-sm mt-2 text-red-600';
        updateMessage.textContent = t.errorFailed;
      } finally {
        submitBtn.disabled = false;
      }
    });

    init();
    });
  </script>
</body>
</html>
