<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Eslami Electric</title>
  <link rel="stylesheet" href="css/mobile.css">
  <style>html:not(.locale-ready) body{opacity:0}</style>
  <script src="js/locale-bootstrap.js"></script>
  <script src="js/price-format.js"></script>
  <script src="js/locale-init.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <div class="flex-1 flex items-center justify-center p-4 w-full">
  <div class="bg-white rounded-xl shadow-md p-8 max-w-md text-center">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Payment successful</h1>
    <p class="text-slate-600 mb-4">Thank you for your order.</p>
    <div id="guest-order-info" class="hidden mb-6 p-4 bg-slate-50 rounded-lg text-left text-sm">
      <p class="font-medium text-slate-700 mb-1">Order number: <span id="order-id-display"></span></p>
      <p class="text-slate-600 mb-2">Save this link to track your order (we’ll also email you a receipt):</p>
      <a id="guest-order-link" href="#" class="block break-all text-emerald-600 hover:underline"></a>
    </div>
    <div class="flex flex-wrap gap-2 justify-center">
      <a href="orders.html" id="link-my-orders" class="inline-block px-4 py-2 rounded bg-emerald-600 text-white font-medium hover:bg-emerald-500">My Orders</a>
      <a href="order.html" id="link-track-order" class="hidden inline-block px-4 py-2 rounded bg-emerald-600 text-white font-medium hover:bg-emerald-500">Track this order</a>
      <a href="index.html" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400">Back to Home</a>
      <a href="basket.html" class="inline-block px-4 py-2 rounded bg-slate-200 text-slate-800 font-medium hover:bg-slate-300">View Basket</a>
    </div>
  </div>
  </div>
  <footer class="bg-slate-800 text-slate-300 py-4 mt-auto w-full shrink-0">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p>&copy; 2026 Eslami Electric. All rights reserved.</p>
      <p class="text-xs text-slate-500 mt-2">Website developed by Vafa Abadi.</p>
    </div>
  </footer>
  <script>
    runWhenLocaleReady(function () {
    (function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        if (sessionId && typeof localStorage !== 'undefined') {
          localStorage.removeItem('basket');
        }
        if (sessionId && typeof sessionStorage !== 'undefined') {
          sessionStorage.removeItem('pendingCheckoutOrderId');
          sessionStorage.removeItem('pendingCheckoutOrderLabel');
        }
        if (sessionId) {
          fetch('/api/orders/confirm-by-session/' + encodeURIComponent(sessionId), { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function () { return fetch('/api/orders/by-session/' + encodeURIComponent(sessionId)); })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (order) {
              if (order && order.guest_access_token) {
                var guestInfo = document.getElementById('guest-order-info');
                var orderIdDisplay = document.getElementById('order-id-display');
                var guestLink = document.getElementById('guest-order-link');
                var linkMyOrders = document.getElementById('link-my-orders');
                var linkTrack = document.getElementById('link-track-order');
                if (guestInfo) guestInfo.classList.remove('hidden');
                if (orderIdDisplay) orderIdDisplay.textContent = order.order_number || order.id;
                var trackUrl = window.location.origin + '/order.html?token=' + encodeURIComponent(order.guest_access_token);
                if (guestLink) { guestLink.href = trackUrl; guestLink.textContent = trackUrl; }
                if (linkMyOrders) linkMyOrders.classList.add('hidden');
                if (linkTrack) { linkTrack.href = trackUrl; linkTrack.classList.remove('hidden'); }
              }
            })
            .catch(function () {});
        }
      } catch (e) {}
    })();
    });
  </script>
</body>
</html>
