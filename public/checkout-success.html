<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Lighting Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-md p-8 max-w-md text-center">
    <h1 class="text-2xl font-bold text-slate-800 mb-2">Payment successful</h1>
    <p class="text-slate-600 mb-6">Thank you for your order.</p>
    <div class="flex flex-wrap gap-2 justify-center">
      <a href="orders.html" class="inline-block px-4 py-2 rounded bg-emerald-600 text-white font-medium hover:bg-emerald-500">My Orders</a>
      <a href="index.html" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400">Back to Home</a>
      <a href="basket.html" class="inline-block px-4 py-2 rounded bg-slate-200 text-slate-800 font-medium hover:bg-slate-300">View Basket</a>
    </div>
  </div>
  <script>
    (function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        if (sessionId && typeof localStorage !== 'undefined') {
          localStorage.removeItem('basket');
        }
        if (sessionId) {
          fetch('/api/orders/confirm-by-session/' + encodeURIComponent(sessionId), { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function () {})
            .catch(function () {});
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
