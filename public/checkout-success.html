<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - Eslami Electric</title>
  <link rel="stylesheet" href="css/mobile.css">
  <style>html:not(.locale-ready) body{opacity:0}</style>
  <script src="js/locale-bootstrap.js"></script>
  <script src="js/price-format.js"></script>
  <script src="js/locale-init.js"></script>
  <script src="js/site-footer-i18n.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <div class="flex-1 flex items-center justify-center p-4 w-full">
  <div class="bg-white rounded-xl shadow-md p-8 max-w-md w-full text-center">
    <div class="flex justify-end gap-2 mb-4">
      <button type="button" id="lang-en" class="px-3 py-1 rounded text-xs font-medium bg-amber-500 text-slate-900">English</button>
      <button type="button" id="lang-fa" class="px-3 py-1 rounded text-xs font-medium text-slate-600 border border-slate-300 hover:bg-slate-50">فارسی</button>
    </div>
    <h1 id="success-title" class="text-2xl font-bold text-slate-800 mb-2">Payment successful</h1>
    <p id="success-thanks" class="text-slate-600 mb-4">Thank you for your order.</p>
    <div id="guest-order-info" class="hidden mb-6 p-4 bg-slate-50 rounded-lg text-start text-sm">
      <p class="font-medium text-slate-700 mb-1"><span id="guest-order-label">Order number:</span> <span id="order-id-display" class="font-mono"></span></p>
      <p id="guest-order-hint" class="text-slate-600 mb-2">Save this link to track your order (we’ll also email you a receipt):</p>
      <a id="guest-order-link" href="#" class="block break-all text-emerald-600 hover:underline"></a>
    </div>
    <div class="flex flex-wrap gap-2 justify-center">
      <a href="orders.html" id="link-my-orders" class="inline-block px-4 py-2 rounded bg-emerald-600 text-white font-medium hover:bg-emerald-500">My Orders</a>
      <a href="order.html" id="link-track-order" class="hidden inline-block px-4 py-2 rounded bg-emerald-600 text-white font-medium hover:bg-emerald-500">Track this order</a>
      <a href="index.html" id="link-home" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400">Back to Home</a>
      <a href="basket.html" id="link-basket" class="inline-block px-4 py-2 rounded bg-slate-200 text-slate-800 font-medium hover:bg-slate-300">View Basket</a>
    </div>
  </div>
  </div>
  <footer class="bg-slate-800 text-slate-300 py-4 mt-auto w-full shrink-0">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>
  <script>
    runWhenLocaleReady(function () {
    var translations = {
      en: {
        pageTitle: 'Payment Successful - Eslami Electric',
        successTitle: 'Payment successful',
        successThanks: 'Thank you for your order.',
        guestOrderLabel: 'Order number:',
        guestOrderHint: 'Save this link to track your order (we’ll also email you a receipt):',
        myOrders: 'My Orders',
        trackOrder: 'Track this order',
        backHome: 'Back to Home',
        viewBasket: 'View Basket'
      },
      fa: {
        pageTitle: 'پرداخت موفق - الکتریکی اسلامی',
        successTitle: 'پرداخت با موفقیت انجام شد',
        successThanks: 'از خرید شما سپاسگزاریم.',
        guestOrderLabel: 'شماره سفارش:',
        guestOrderHint: 'این لینک را برای پیگیری سفارش ذخیره کنید (رسید هم به ایمیل شما ارسال می‌شود):',
        myOrders: 'سفارشات من',
        trackOrder: 'پیگیری این سفارش',
        backHome: 'بازگشت به خانه',
        viewBasket: 'سبد خرید'
      }
    };
    var currentLang = localStorage.getItem('lang') || 'en';

    function applyPageLanguage() {
      var t = translations[currentLang];
      document.title = t.pageTitle;
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('success-title').textContent = t.successTitle;
      document.getElementById('success-thanks').textContent = t.successThanks;
      document.getElementById('guest-order-label').textContent = t.guestOrderLabel;
      document.getElementById('guest-order-hint').textContent = t.guestOrderHint;
      document.getElementById('link-my-orders').textContent = t.myOrders;
      document.getElementById('link-track-order').textContent = t.trackOrder;
      document.getElementById('link-home').textContent = t.backHome;
      document.getElementById('link-basket').textContent = t.viewBasket;
      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1 rounded text-xs font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1 rounded text-xs font-medium text-slate-600 border border-slate-300 hover:bg-slate-50';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1 rounded text-xs font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1 rounded text-xs font-medium text-slate-600 border border-slate-300 hover:bg-slate-50';
      if (typeof applyFooterI18n === 'function') applyFooterI18n();
    }

    document.getElementById('lang-en').addEventListener('click', function() {
      currentLang = 'en';
      localStorage.setItem('lang', 'en');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });
    document.getElementById('lang-fa').addEventListener('click', function() {
      currentLang = 'fa';
      localStorage.setItem('lang', 'fa');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });

    (function () {
      try {
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        if (sessionId && typeof localStorage !== 'undefined') {
          localStorage.removeItem('basket');
        }
        if (sessionId && typeof sessionStorage !== 'undefined') {
          sessionStorage.removeItem('pendingCheckoutOrderId');
          sessionStorage.removeItem('pendingCheckoutOrderLabel');
        }
        if (sessionId) {
          fetch('/api/orders/confirm-by-session/' + encodeURIComponent(sessionId), { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function () { return fetch('/api/orders/by-session/' + encodeURIComponent(sessionId)); })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (order) {
              if (order && order.guest_access_token) {
                var guestInfo = document.getElementById('guest-order-info');
                var orderIdDisplay = document.getElementById('order-id-display');
                var guestLink = document.getElementById('guest-order-link');
                var linkMyOrders = document.getElementById('link-my-orders');
                var linkTrack = document.getElementById('link-track-order');
                if (guestInfo) guestInfo.classList.remove('hidden');
                if (orderIdDisplay) orderIdDisplay.textContent = order.order_number || order.id;
                var trackUrl = window.location.origin + '/order.html?token=' + encodeURIComponent(order.guest_access_token);
                if (guestLink) { guestLink.href = trackUrl; guestLink.textContent = trackUrl; }
                if (linkMyOrders) linkMyOrders.classList.add('hidden');
                if (linkTrack) { linkTrack.href = trackUrl; linkTrack.classList.remove('hidden'); }
              }
            })
            .catch(function () {});
        }
      } catch (e) {}
    })();

    applyPageLanguage();
    });
  </script>
</body>
</html>
