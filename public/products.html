<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Lighting Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
  <script>
    (function() {
      fetch('/api/categories').then(function(r) { return r.json(); }).then(function(data) {
        window.__categoriesPreload = data;
      }).catch(function(e) { window.__categoriesError = e; });
    })();
  </script>
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <a href="index.html" class="hover:opacity-80">
          <h1 id="site-title" class="text-2xl font-bold tracking-tight">Lighting Products</h1>
          <p id="site-subtitle" class="text-slate-400 text-sm">Quality electrical supplies</p>
        </a>
      </div>
      <nav class="flex items-center gap-2" aria-label="Language and actions">
        <a href="index.html" id="nav-home" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Home</a>
        <a href="products.html" id="nav-products" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">Products</a>
        <a href="basket.html" id="nav-basket" class="relative inline-flex px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Basket<span id="basket-count" class="hidden ml-1 min-w-[1.25rem] h-5 px-1 rounded-full bg-amber-500 text-slate-900 text-xs font-bold inline-flex items-center justify-center"></span></a>
        <a href="orders.html" id="nav-orders" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">My Orders</a>
        <a href="login.html" id="nav-login" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Login</a>
        <a
          id="go-account"
          href="account.html"
          rel="noopener"
          class="px-3 py-1.5 rounded text-sm font-medium bg-emerald-500 text-slate-900 hover:bg-emerald-400 transition-colors"
        >
          Sign Up
        </a>
        <button id="nav-logout" type="button" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Logout</button>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors">فارسی</button>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    <h2 id="page-title" class="text-3xl font-bold text-slate-800 mb-6">Products</h2>

    <div id="category-tabs" class="flex flex-wrap gap-2 mb-6"></div>

    <p id="loading" class="text-center text-slate-500 py-8">Loading categories...</p>
    <div id="error" class="hidden rounded-xl bg-red-50 border border-red-200 p-4 text-red-700 text-center"></div>
    <p id="no-categories" class="hidden text-center text-slate-500 py-4">No categories available.</p>
    <p id="no-products" class="hidden text-center text-slate-500"></p>

    <div id="products-grid" class="hidden grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-8 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p>&copy; 2026 Lighting Products. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const translations = {
      en: {
        siteTitle: 'Lighting Products',
        siteSubtitle: 'Quality electrical supplies',
        pageTitle: 'Products',
        loading: 'Loading categories...',
        errorLoad: 'Failed to load categories.',
        noProducts: 'No products in this category.',
        noCategories: 'No categories available. Start the server with: node server.js',
        navHome: 'Home',
        navProducts: 'Products',
        navBasket: 'Basket',
        navLogin: 'Login',
        navLogout: 'Logout',
        createAccount: 'Sign Up',
        wattage: 'W',
        addToBasket: 'Add',
        quantity: 'Qty'
      },
      fa: {
        siteTitle: 'محصولات روشنایی',
        siteSubtitle: 'تجهیزات برقی با کیفیت',
        pageTitle: 'محصولات',
        loading: 'در حال بارگذاری دسته‌بندی‌ها...',
        errorLoad: 'بارگذاری دسته‌بندی‌ها ناموفق بود.',
        noProducts: 'محصولی در این دسته‌بندی وجود ندارد.',
        noCategories: 'دسته‌بندی موجود نیست. سرور را با node server.js اجرا کنید.',
        navHome: 'خانه',
        navProducts: 'محصولات',
        navBasket: 'سبد خرید',
        navLogin: 'ورود',
        navLogout: 'خروج',
        createAccount: 'ایجاد حساب کاربری',
        wattage: 'وات',
        addToBasket: 'افزودن',
        quantity: 'تعداد'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';
    let categoriesData = [];
    let selectedCategoryId = null;

    const categoryTabs = document.getElementById('category-tabs');
    const productsGrid = document.getElementById('products-grid');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const noCategoriesEl = document.getElementById('no-categories');
    const noProducts = document.getElementById('no-products');

    const BASKET_KEY = 'basket';

    function getBasket() {
      try {
        const raw = localStorage.getItem(BASKET_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function setBasket(items) {
      localStorage.setItem(BASKET_KEY, JSON.stringify(items));
      updateBasketCount();
    }

    function addToBasket(product, categoryId, quantity) {
      const basket = getBasket();
      const existing = basket.find(item => item.id === product.id);
      if (existing) existing.quantity += quantity;
      else basket.push({ id: product.id, categoryId: categoryId || null, name: product.name, name_fa: product.name_fa, image_url: product.image_url, price: product.price, quantity });
      setBasket(basket);
    }

    function updateBasketCount() {
      const basket = getBasket();
      const total = basket.reduce((sum, item) => sum + item.quantity, 0);
      const el = document.getElementById('basket-count');
      if (!el) return;
      if (total > 0) {
        el.textContent = total > 99 ? '99+' : total;
        el.classList.remove('hidden');
      } else el.classList.add('hidden');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function getCategoryName(cat) {
      return currentLang === 'fa' && cat.name_fa ? cat.name_fa : cat.name;
    }

    function applyPageLanguage() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('site-subtitle').textContent = t.siteSubtitle;
      document.getElementById('page-title').textContent = t.pageTitle;
      loading.textContent = t.loading;
      document.getElementById('nav-home').textContent = t.navHome;
      document.getElementById('nav-products').textContent = t.navProducts;
      document.getElementById('nav-basket').innerHTML = t.navBasket + '<span id="basket-count" class="hidden ml-1 min-w-[1.25rem] h-5 px-1 rounded-full bg-amber-500 text-slate-900 text-xs font-bold inline-flex items-center justify-center"></span>';
      updateBasketCount();
      document.getElementById('nav-login').textContent = t.navLogin;
      document.getElementById('nav-logout').textContent = t.navLogout;
      document.getElementById('go-account').textContent = t.createAccount;

      const token = localStorage.getItem('token');
      document.getElementById('nav-login').classList.toggle('hidden', !!token);
      document.getElementById('nav-logout').classList.toggle('hidden', !token);
      document.getElementById('go-account').classList.toggle('hidden', !!token);
      const navOrders = document.getElementById('nav-orders');
      if (navOrders) navOrders.classList.toggle('hidden', !token);

      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';

      renderCategoryTabs();
      if (selectedCategoryId) {
        renderProducts(selectedCategoryId);
      }
    }

    function renderCategoryTabs() {
      categoryTabs.innerHTML = '';
      categoriesData.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-colors ' +
          (cat.id === selectedCategoryId
            ? 'bg-amber-500 text-slate-900'
            : 'bg-white text-slate-700 hover:bg-slate-200 shadow');
        btn.textContent = getCategoryName(cat);
        btn.dataset.categoryId = cat.id;
        btn.addEventListener('click', () => selectCategory(cat.id));
        categoryTabs.appendChild(btn);
      });
    }

    function selectCategory(categoryId) {
      selectedCategoryId = categoryId;
      renderCategoryTabs();
      renderProducts(categoryId);
    }

    function renderProducts(categoryId) {
      const cat = categoriesData.find(c => c.id === categoryId);
      if (!cat) return;

      const t = translations[currentLang];
      productsGrid.innerHTML = '';
      productsGrid.classList.remove('hidden');
      noProducts.classList.add('hidden');

      if (!cat.products || cat.products.length === 0) {
        noProducts.textContent = t.noProducts;
        noProducts.classList.remove('hidden');
        return;
      }

      const catId = cat.id || '';
      cat.products.forEach(p => {
        const name = currentLang === 'fa' && p.name_fa ? p.name_fa : p.name;
        const wattageHtml = p.wattage != null
          ? `<p class="text-slate-500 text-sm mt-1">${p.wattage} ${t.wattage}</p>`
          : '';
        const productId = p.id ? escapeHtml(p.id) : '';
        const catIdEscaped = escapeHtml(catId);
        productsGrid.insertAdjacentHTML('beforeend', `
          <article class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow" data-product-id="${productId}" data-category-id="${catIdEscaped}">
            <div class="aspect-[4/3] bg-slate-200 overflow-hidden">
              <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(name)}" class="w-full h-full object-cover" loading="lazy">
            </div>
            <div class="p-4">
              <h3 class="text-lg font-semibold text-slate-800 mt-1">${escapeHtml(name)}</h3>
              ${wattageHtml}
              <p class="text-xl font-bold text-slate-900 mt-2">$${Number(p.price).toFixed(2)}</p>
              <div class="mt-3 flex items-center gap-2 flex-wrap">
                <div class="flex items-center border border-slate-300 rounded overflow-hidden">
                  <button type="button" class="btn-qty-minus w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium" aria-label="Decrease quantity">−</button>
                  <span class="qty-display w-10 text-center text-sm font-medium border-x border-slate-300">1</span>
                  <button type="button" class="btn-qty-plus w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium" aria-label="Increase quantity">+</button>
                </div>
                <button type="button" class="btn-add-to-basket px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium text-sm hover:bg-amber-400 transition-colors">${t.addToBasket}</button>
              </div>
            </div>
          </article>
        `);
      });
    }

    productsGrid.addEventListener('click', (e) => {
      const article = e.target.closest('article[data-product-id]');
      if (!article) return;
      const productId = article.getAttribute('data-product-id');
      const categoryId = article.getAttribute('data-category-id') || null;
      const cat = categoriesData.find(c => c.id === categoryId);
      const product = cat && cat.products ? cat.products.find(p => (p.id || '') === productId) : null;
      if (!product) return;

      const qtyEl = article.querySelector('.qty-display');
      let qty = parseInt(qtyEl.textContent, 10) || 1;

      if (e.target.classList.contains('btn-qty-minus')) {
        if (qty > 1) { qty--; qtyEl.textContent = qty; }
      } else if (e.target.classList.contains('btn-qty-plus')) {
        qty++; qtyEl.textContent = qty;
      } else if (e.target.classList.contains('btn-add-to-basket')) {
        addToBasket(product, categoryId, qty);
        qtyEl.textContent = '1';
      }
    });

    function scrollToProduct(productId) {
      const el = document.querySelector('[data-product-id="' + productId.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) + '"]');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.classList.add('ring-2', 'ring-amber-400', 'ring-offset-2');
        setTimeout(() => el.classList.remove('ring-2', 'ring-amber-400', 'ring-offset-2'), 2500);
      }
    }

    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return { category: params.get('category'), product: params.get('product') };
    }

    async function loadCategories() {
      try {
        var data = window.__categoriesPreload;
        if (!data) {
          var res = await fetch('/api/categories');
          if (!res.ok) throw new Error('Request failed: ' + res.status);
          data = await res.json();
        }
        loading.classList.add('hidden');
        errorEl.classList.add('hidden');
        noCategoriesEl.classList.add('hidden');

        categoriesData = Array.isArray(data) ? data : (data && data.categories) ? data.categories : [];

        if (categoriesData.length === 0) {
          noCategoriesEl.textContent = translations[currentLang].noCategories;
          noCategoriesEl.classList.remove('hidden');
          return;
        }

        const { category: urlCategory, product: urlProduct } = getUrlParams();
        const categoryExists = urlCategory && categoriesData.some(c => c.id === urlCategory);
        selectedCategoryId = categoryExists ? urlCategory : categoriesData[0].id;

        applyPageLanguage();
        if (urlProduct) requestAnimationFrame(() => scrollToProduct(urlProduct));
      } catch (err) {
        loading.classList.add('hidden');
        noCategoriesEl.classList.add('hidden');
        errorEl.classList.remove('hidden');
        errorEl.textContent = translations[currentLang].errorLoad + ' Run: node server.js';
        console.error('Products load error:', err);
      }
    }

    loadCategories();

    var langEn = document.getElementById('lang-en');
    if (langEn) langEn.addEventListener('click', function() { currentLang = 'en'; localStorage.setItem('lang', 'en'); applyPageLanguage(); });
    var langFa = document.getElementById('lang-fa');
    if (langFa) langFa.addEventListener('click', function() { currentLang = 'fa'; localStorage.setItem('lang', 'fa'); applyPageLanguage(); });
    var navLogoutEl = document.getElementById('nav-logout');
    if (navLogoutEl) navLogoutEl.addEventListener('click', function() { localStorage.removeItem('token'); window.location.reload(); });
  </script>
</body>
</html>
