<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Eslami Electric</title>
  <link rel="stylesheet" href="css/tailwind.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/mobile.css"></noscript>
  <link rel="stylesheet" href="css/mobile.css" media="print" onload="this.media='all'">
  <script src="/js/auth-nav-sync.js" defer></script>
  <script src="js/locale-bootstrap.js" defer></script>
  <script src="js/price-format.js" defer></script>
  <script src="js/locale-init.js" defer></script>
  <script src="js/site-footer-i18n.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <script>
    (function() {
      fetch('/api/categories').then(function(r) { return r.json(); }).then(function(data) {
        window.__categoriesPreload = data;
      }).catch(function(e) { window.__categoriesError = e; });
    })();
  </script>
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <a href="basket.html" id="nav-basket-mobile" class="sm:hidden relative inline-flex items-center justify-center px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors shrink-0" aria-label="Basket"><span id="nav-basket-mobile-label">Basket</span><span id="basket-count-mobile" class="hidden ml-1 min-w-[1.25rem] h-5 px-1 rounded-full bg-amber-500 text-slate-900 text-xs font-bold inline-flex items-center justify-center"></span></a>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto" aria-label="Language and actions">
        <a href="index.html" id="nav-home" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Home</a>
        <a href="products.html" id="nav-products" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">Products</a>
        <a href="basket.html" id="nav-basket" class="hidden sm:relative sm:inline-flex items-center px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors"><span id="nav-basket-label">Basket</span><span id="basket-count" class="hidden ml-1 min-w-[1.25rem] h-5 px-1 rounded-full bg-amber-500 text-slate-900 text-xs font-bold inline-flex items-center justify-center"></span></a>
        <a href="orders.html" id="nav-orders" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">My Orders</a>
        <a href="profile.html" id="nav-profile" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">My Profile</a>
        <a href="login.html" id="nav-login" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Login</a>
        <a id="go-account" href="account.html" rel="noopener" class="px-3 py-1.5 rounded text-sm font-medium bg-emerald-500 text-slate-900 hover:bg-emerald-400 transition-colors">Sign Up</a>
        <button id="nav-logout" type="button" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors text-left sm:text-center">Logout</button>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900 text-left sm:text-center">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors text-left sm:text-center">فارسی</button>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js" defer></script>

  <main id="products-page-main" class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    <h2 id="page-title" class="text-2xl sm:text-3xl font-bold text-slate-800 mb-4 sm:mb-6">Products</h2>

    <div id="category-tabs" class="flex flex-wrap gap-2 mb-4 sm:mb-6"></div>

    <div id="sort-bar" class="hidden mb-4 flex flex-wrap items-center justify-end gap-2 sm:gap-3">
      <label for="product-sort" id="label-product-sort" class="text-sm font-medium text-slate-700 whitespace-nowrap">Sort by</label>
      <select id="product-sort" class="min-w-[12rem] max-w-full border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-amber-400"></select>
    </div>

    <p id="loading" class="text-center text-slate-500 py-8 min-h-[3rem]">Loading categories...</p>
    <div id="error" class="hidden rounded-xl bg-red-50 border border-red-200 p-4 text-red-700 text-center"></div>
    <p id="no-categories" class="hidden text-center text-slate-500 py-4">No categories available.</p>
    <p id="no-products" class="hidden text-center text-slate-500"></p>

    <div id="products-grid" class="hidden grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-8 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>

  <script defer src="js/products-page.js"></script>
  <script defer src="/js/whatsapp-fab.js"></script>
</body>
</html>
