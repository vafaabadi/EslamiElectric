<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Lighting Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <a href="index.html" class="hover:opacity-80">
          <h1 id="site-title" class="text-2xl font-bold tracking-tight">Lighting Products</h1>
          <p id="site-subtitle" class="text-slate-400 text-sm">Quality electrical supplies</p>
        </a>
      </div>
      <nav class="flex items-center gap-2" aria-label="Language and actions">
        <a href="index.html" id="nav-home" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Home</a>
        <a href="products.html" id="nav-products" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">Products</a>
        <a
          id="go-account"
          href="account.html"
          target="_blank"
          rel="noopener"
          class="px-3 py-1.5 rounded text-sm font-medium bg-emerald-500 text-slate-900 hover:bg-emerald-400 transition-colors"
        >
          Sign Up
        </a>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors">فارسی</button>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    <h2 id="page-title" class="text-3xl font-bold text-slate-800 mb-6">Products</h2>

    <div id="category-tabs" class="flex flex-wrap gap-2 mb-6"></div>

    <p id="loading" class="text-center text-slate-500">Loading categories...</p>
    <p id="error" class="hidden text-center text-red-600"></p>
    <p id="no-products" class="hidden text-center text-slate-500"></p>

    <div id="products-grid" class="hidden grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-8 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p>&copy; 2026 Lighting Products. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const translations = {
      en: {
        siteTitle: 'Lighting Products',
        siteSubtitle: 'Quality electrical supplies',
        pageTitle: 'Products',
        loading: 'Loading categories...',
        errorLoad: 'Failed to load categories.',
        noProducts: 'No products in this category.',
        navHome: 'Home',
        navProducts: 'Products',
        createAccount: 'Sign Up',
        wattage: 'W'
      },
      fa: {
        siteTitle: 'محصولات روشنایی',
        siteSubtitle: 'تجهیزات برقی با کیفیت',
        pageTitle: 'محصولات',
        loading: 'در حال بارگذاری دسته‌بندی‌ها...',
        errorLoad: 'بارگذاری دسته‌بندی‌ها ناموفق بود.',
        noProducts: 'محصولی در این دسته‌بندی وجود ندارد.',
        navHome: 'خانه',
        navProducts: 'محصولات',
        createAccount: 'ایجاد حساب کاربری',
        wattage: 'وات'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';
    let categoriesData = [];
    let selectedCategoryId = null;

    const categoryTabs = document.getElementById('category-tabs');
    const productsGrid = document.getElementById('products-grid');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const noProducts = document.getElementById('no-products');

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function getCategoryName(cat) {
      return currentLang === 'fa' && cat.name_fa ? cat.name_fa : cat.name;
    }

    function applyPageLanguage() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('site-subtitle').textContent = t.siteSubtitle;
      document.getElementById('page-title').textContent = t.pageTitle;
      loading.textContent = t.loading;
      document.getElementById('nav-home').textContent = t.navHome;
      document.getElementById('nav-products').textContent = t.navProducts;
      document.getElementById('go-account').textContent = t.createAccount;

      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';

      renderCategoryTabs();
      if (selectedCategoryId) {
        renderProducts(selectedCategoryId);
      }
    }

    function renderCategoryTabs() {
      categoryTabs.innerHTML = '';
      categoriesData.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-colors ' +
          (cat.id === selectedCategoryId
            ? 'bg-amber-500 text-slate-900'
            : 'bg-white text-slate-700 hover:bg-slate-200 shadow');
        btn.textContent = getCategoryName(cat);
        btn.dataset.categoryId = cat.id;
        btn.addEventListener('click', () => selectCategory(cat.id));
        categoryTabs.appendChild(btn);
      });
    }

    function selectCategory(categoryId) {
      selectedCategoryId = categoryId;
      renderCategoryTabs();
      renderProducts(categoryId);
    }

    function renderProducts(categoryId) {
      const cat = categoriesData.find(c => c.id === categoryId);
      if (!cat) return;

      const t = translations[currentLang];
      productsGrid.innerHTML = '';
      productsGrid.classList.remove('hidden');
      noProducts.classList.add('hidden');

      if (!cat.products || cat.products.length === 0) {
        noProducts.textContent = t.noProducts;
        noProducts.classList.remove('hidden');
        return;
      }

      cat.products.forEach(p => {
        const name = currentLang === 'fa' && p.name_fa ? p.name_fa : p.name;
        const wattageHtml = p.wattage != null
          ? `<p class="text-slate-500 text-sm mt-1">${p.wattage} ${t.wattage}</p>`
          : '';
        productsGrid.insertAdjacentHTML('beforeend', `
          <article class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
            <div class="aspect-[4/3] bg-slate-200 overflow-hidden">
              <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(name)}" class="w-full h-full object-cover" loading="lazy">
            </div>
            <div class="p-4">
              <h3 class="text-lg font-semibold text-slate-800 mt-1">${escapeHtml(name)}</h3>
              ${wattageHtml}
              <p class="text-xl font-bold text-slate-900 mt-2">$${Number(p.price).toFixed(2)}</p>
            </div>
          </article>
        `);
      });
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        if (!res.ok) throw new Error('Request failed');
        categoriesData = await res.json();
        loading.classList.add('hidden');

        if (categoriesData.length > 0) {
          selectedCategoryId = categoriesData[0].id;
        }
        applyPageLanguage();
      } catch (err) {
        loading.classList.add('hidden');
        errorEl.textContent = translations[currentLang].errorLoad;
        errorEl.classList.remove('hidden');
      }
    }

    document.getElementById('lang-en').addEventListener('click', () => {
      currentLang = 'en';
      localStorage.setItem('lang', 'en');
      applyPageLanguage();
    });

    document.getElementById('lang-fa').addEventListener('click', () => {
      currentLang = 'fa';
      localStorage.setItem('lang', 'fa');
      applyPageLanguage();
    });

    loadCategories();
  </script>
</body>
</html>
