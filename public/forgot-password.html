<!DOCTYPE html>
<html lang="en">
<head>
  <!--SERVER_PUBLIC_CONFIG-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Eslami Electric</title>
  <link rel="stylesheet" href="css/tailwind.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/mobile.css"></noscript>
  <link rel="stylesheet" href="css/mobile.css" media="print" onload="this.media='all'">
  <script src="/js/auth-nav-sync.js" defer></script>
  <script src="js/locale-bootstrap.js" defer></script>
  <script src="js/price-format.js" defer></script>
  <script src="js/locale-init.js" defer></script>
  <script src="js/site-footer-i18n.js" defer></script>
  <script src="js/form-feedback.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto">
        <a href="login.html" id="nav-login" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Log In</a>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors">فارسی</button>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js" defer></script>

  <main class="flex-grow max-w-md w-full mx-auto px-4 py-8">
    <h2 id="form-title" class="text-2xl font-bold text-slate-800 mb-6">Forgot Password</h2>

    <p id="form-description" class="text-slate-600 text-sm mb-4">Enter your email and we'll send you a link to reset your password.</p>

    <form id="forgot-form" class="bg-white rounded-xl shadow-md p-6 space-y-4">
      <div>
        <label id="label-email" for="email" class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
        <input type="email" id="email" required autocomplete="email" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <button id="submit-btn" type="submit" class="w-full bg-amber-500 text-slate-900 font-semibold py-2 rounded hover:bg-amber-400 transition-[box-shadow,colors] duration-150">
        Send Reset Link
      </button>
      <p id="forgot-message" class="text-sm mt-2" role="status" aria-live="polite"></p>
    </form>

    <p class="mt-6 text-center text-slate-600 text-sm">
      <a href="login.html" class="text-amber-600 font-medium hover:underline">Back to Log In</a>
    </p>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>

  <script>
    runWhenLocaleReady(function () {
    const translations = {
      en: {
        siteTitle: 'Eslami Electric',
        siteSubtitle: 'Quality electrical supplies',
        formTitle: 'Forgot Password',
        formDescription: "Enter your email and we'll send you a link to reset your password.",
        labelEmail: 'Email *',
        submitBtn: 'Send Reset Link',
        backToLogin: 'Back to Log In',
        successMessage: "If an account exists for this email, we've sent a reset link. Check your inbox and spam.",
        errorFailed: 'Something went wrong. Please try again.',
        errorNoConfig: 'Password reset is not configured. Contact support.'
      },
      fa: {
        siteTitle: 'الکتریکی اسلامی',
        siteSubtitle: 'تجهیزات برقی با کیفیت',
        formTitle: 'فراموشی رمز عبور',
        formDescription: 'ایمیل خود را وارد کنید تا لینک بازنشانی رمز عبور برای شما ارسال شود.',
        labelEmail: 'ایمیل *',
        submitBtn: 'ارسال لینک بازنشانی',
        backToLogin: 'بازگشت به ورود',
        successMessage: 'اگر حسابی با این ایمیل وجود داشته باشد، لینک بازنشانی ارسال شده است. صندوق ورودی و هرزنامه را بررسی کنید.',
        errorFailed: 'خطایی رخ داد. لطفاً دوباره تلاش کنید.',
        errorNoConfig: 'بازنشانی رمز عبور پیکربندی نشده است.'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    const forgotForm = document.getElementById('forgot-form');
    const forgotMessage = document.getElementById('forgot-message');
    const submitBtn = document.getElementById('submit-btn');

    function forgotFeedback(isError, text) {
      forgotMessage.className = isError ? 'text-sm mt-2 text-red-600' : 'text-sm mt-2 text-emerald-600';
      forgotMessage.textContent = text;
      if (typeof window.setPrimaryButtonError === 'function') {
        window.setPrimaryButtonError(submitBtn, !!isError);
      }
      if (typeof window.scrollFeedbackIntoView === 'function') {
        window.scrollFeedbackIntoView(forgotMessage);
      }
    }

    function applyPageLanguage() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('site-subtitle').textContent = t.siteSubtitle;
      document.getElementById('form-title').textContent = t.formTitle;
      document.getElementById('form-description').textContent = t.formDescription;
      document.getElementById('label-email').textContent = t.labelEmail;
      document.getElementById('submit-btn').textContent = t.submitBtn;
      document.querySelector('main .mt-6 a').textContent = t.backToLogin;
      document.getElementById('nav-login').textContent = currentLang === 'fa' ? 'ورود' : 'Log In';
      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      if (typeof applyFooterI18n === 'function') applyFooterI18n();
    }

    document.getElementById('lang-en').addEventListener('click', function() {
      currentLang = 'en';
      localStorage.setItem('lang', 'en');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });
    document.getElementById('lang-fa').addEventListener('click', function() {
      currentLang = 'fa';
      localStorage.setItem('lang', 'fa');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      forgotMessage.textContent = '';
      forgotMessage.className = 'text-sm mt-2';
      if (typeof window.setPrimaryButtonError === 'function') {
        window.setPrimaryButtonError(submitBtn, false);
      }
      const t = translations[currentLang];
      const email = document.getElementById('email').value.trim();
      if (!email) return;

      try {
        submitBtn.disabled = true;
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json().catch(function () {
          return {};
        });
        if (res.status === 503) {
          forgotFeedback(true, t.errorNoConfig);
          return;
        }
        if (!res.ok) {
          forgotFeedback(true, (data && data.error) || t.errorFailed);
          return;
        }

        forgotFeedback(false, t.successMessage);
      } catch (err) {
        forgotFeedback(true, t.errorFailed);
      } finally {
        submitBtn.disabled = false;
      }
    });

    applyPageLanguage();
    });
  </script>
</body>
</html>
