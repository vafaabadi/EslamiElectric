<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Eslami Electric</title>
  <link rel="stylesheet" href="css/tailwind.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/mobile.css"></noscript>
  <link rel="stylesheet" href="css/mobile.css" media="print" onload="this.media='all'">
  <script src="/js/auth-nav-sync.js" defer></script>
  <script src="js/locale-bootstrap.js" defer></script>
  <script src="js/price-format.js" defer></script>
  <script src="js/order-line-items.js" defer></script>
  <script src="js/locale-init.js" defer></script>
  <script src="js/site-footer-i18n.js" defer></script>
  <script src="js/form-feedback.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <a href="basket.html" id="nav-basket-mobile" class="sm:hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors shrink-0"><span id="nav-basket-mobile-label">Basket</span></a>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto" aria-label="Navigation">
        <a href="index.html" id="nav-home" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Home</a>
        <a href="products.html" id="nav-products" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Products</a>
        <a href="basket.html" id="nav-basket" class="hidden sm:inline-flex px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors"><span id="nav-basket-label">Basket</span></a>
        <a href="orders.html" id="nav-orders" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">My Orders</a>
        <a href="profile.html" id="nav-profile" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">My Profile</a>
        <a href="login.html" id="nav-login" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Login</a>
        <a href="account.html" id="go-account" class="px-3 py-1.5 rounded text-sm font-medium bg-emerald-500 text-slate-900 hover:bg-emerald-400 transition-colors">Sign Up</a>
        <button id="nav-logout" type="button" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors text-left sm:text-center">Logout</button>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900 text-left sm:text-center">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors text-left sm:text-center">فارسی</button>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js" defer></script>

  <main id="orders-page-main" class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
    <h2 id="page-title" class="text-3xl font-bold text-slate-800 mb-6">My Orders</h2>
    <p id="orders-resume-email-hint" class="hidden text-sm text-slate-600 mb-4 max-w-2xl" role="note"></p>

    <div id="orders-login-required" class="hidden bg-white rounded-xl shadow-md p-8 text-center text-slate-600">
      <p id="login-required-message" class="mb-4">Log in to view your orders.</p>
      <a href="login.html" id="login-required-link" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400 transition-colors">Log In</a>
    </div>

    <div id="orders-loading" class="hidden bg-white rounded-xl shadow-md p-8 text-center text-slate-500">
      <p>Loading orders…</p>
    </div>

    <div id="orders-empty" class="hidden bg-white rounded-xl shadow-md p-8 text-center text-slate-500">
      <p id="orders-empty-message" class="mb-4">You have no orders yet.</p>
      <a href="products.html" id="orders-empty-link" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400 transition-colors">Continue shopping</a>
    </div>

    <ul id="orders-list" class="space-y-4"></ul>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>

  
  <script defer src="js/orders-page.js"></script>
</body>
</html>
