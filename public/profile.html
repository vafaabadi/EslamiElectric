<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Eslami Electric</title>
  <link rel="stylesheet" href="css/tailwind.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/mobile.css"></noscript>
  <link rel="stylesheet" href="css/mobile.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/css/intlTelInput.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/intl-phone.css" media="print" onload="this.media='all'">
  <script src="/js/auth-nav-sync.js" defer></script>
  <script src="js/locale-bootstrap.js" defer></script>
  <script src="js/price-format.js" defer></script>
  <script src="js/locale-init.js" defer></script>
  <script src="js/site-footer-i18n.js" defer></script>
  <script src="js/form-feedback.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <a href="basket.html" id="nav-basket-mobile" class="sm:hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors shrink-0">Basket</a>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto" aria-label="Navigation">
        <a href="index.html" id="nav-home" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Home</a>
        <a href="products.html" id="nav-products" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Products</a>
        <a href="basket.html" id="nav-basket" class="hidden sm:inline-flex px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors"><span id="nav-basket-label">Basket</span></a>
        <a href="orders.html" id="nav-orders" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">My Orders</a>
        <a href="profile.html" id="nav-profile" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">My Profile</a>
        <a href="login.html" id="nav-login" class="hidden px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Login</a>
        <a href="account.html" id="go-account" class="hidden px-3 py-1.5 rounded text-sm font-medium bg-emerald-500 text-slate-900 hover:bg-emerald-400 transition-colors">Sign Up</a>
        <button id="nav-logout" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors text-left sm:text-center">Logout</button>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900 text-left sm:text-center">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors text-left sm:text-center">فارسی</button>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js" defer></script>

  <main class="flex-grow max-w-xl w-full mx-auto px-4 py-8">
    <h2 id="page-title" class="text-2xl font-bold text-slate-800 mb-6">My Profile</h2>

    <div id="profile-redirect" class="hidden bg-white rounded-xl shadow-md p-8 text-center text-slate-600">
      <p id="redirect-message" class="mb-4">Please log in to view your profile.</p>
      <a href="login.html" id="redirect-link" class="inline-block px-4 py-2 rounded bg-amber-500 text-slate-900 font-medium hover:bg-amber-400 transition-colors">Log In</a>
    </div>

    <div id="profile-loading" class="bg-white rounded-xl shadow-md p-8 text-center text-slate-500">
      <p id="loading-text">Loading profile…</p>
    </div>

    <form id="profile-form" class="hidden bg-white rounded-xl shadow-md p-6 space-y-4">
      <div>
        <label id="label-type" class="block text-sm font-medium text-slate-700 mb-1">Account type</label>
        <p id="account-type-display" class="text-slate-800 font-medium"></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label id="label-firstname" for="firstName" class="block text-sm font-medium text-slate-700 mb-1">First name *</label>
          <input type="text" id="firstName" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
        <div>
          <label id="label-surname" for="surname" class="block text-sm font-medium text-slate-700 mb-1">Surname *</label>
          <input type="text" id="surname" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
      </div>

      <div>
        <label id="label-dob" for="dob" class="block text-sm font-medium text-slate-700 mb-1">Date of birth</label>
        <input type="date" id="dob" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <div>
        <label id="label-email" for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" readonly class="w-full border border-slate-200 bg-slate-50 rounded px-3 py-2 text-slate-600 cursor-not-allowed">
        <p id="email-hint" class="text-xs text-slate-500 mt-1">Email cannot be changed here.</p>
        <p id="telegram-email-explain" class="hidden text-xs text-slate-600 mt-2 leading-snug border border-slate-200 rounded-lg px-3 py-2 bg-slate-50"></p>
      </div>

      <div id="contact-email-wrap">
        <label id="label-contact-email" for="contactEmail" class="block text-sm font-medium text-slate-700 mb-1">Contact email *</label>
        <input type="email" id="contactEmail" name="contactEmail" autocomplete="email" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="">
        <p id="contact-email-hint" class="text-xs text-slate-500 mt-1"></p>
      </div>

      <div id="link-email-setup" class="hidden space-y-3 border-2 border-amber-300 rounded-xl p-4 bg-amber-50">
        <h3 id="link-email-title" class="font-semibold text-slate-900 text-sm">Set your email & password</h3>
        <p id="link-email-intro" class="text-xs text-slate-700 leading-snug"></p>
        <div>
          <label id="label-link-email" for="linkRealEmail" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" id="linkRealEmail" autocomplete="email" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white">
        </div>
        <div>
          <label id="label-link-password" for="linkPassword" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" id="linkPassword" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white" minlength="8">
        </div>
        <div>
          <label id="label-link-password2" for="linkPassword2" class="block text-sm font-medium text-slate-700 mb-1">Confirm password</label>
          <input type="password" id="linkPassword2" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400 bg-white" minlength="8">
        </div>
        <button type="button" id="btn-link-email-password" class="w-full py-2.5 rounded-lg bg-amber-500 text-slate-900 font-semibold text-sm hover:bg-amber-400">Save email & password</button>
        <p id="link-email-message" class="text-sm min-h-[1.25rem]"></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label id="label-mobile" for="mobile" class="block text-sm font-medium text-slate-700 mb-1">Mobile *</label>
          <input type="tel" id="mobile" required class="w-full border border-slate-300 rounded px-3 py-2 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
        <div>
          <label id="label-landline" for="landline" class="block text-sm font-medium text-slate-700 mb-1">Landline</label>
          <input type="tel" id="landline" class="w-full border border-slate-300 rounded px-3 py-2 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
      </div>

      <div>
        <label id="label-bank" for="bankDetails" class="block text-sm font-medium text-slate-700 mb-1">Bank account details</label>
        <input type="text" id="bankDetails" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <div>
        <label id="label-address" for="address" class="block text-sm font-medium text-slate-700 mb-1">Address *</label>
        <textarea id="address" rows="3" required class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400"></textarea>
      </div>

      <div id="company-fields" class="hidden space-y-4 border-t pt-4">
        <h3 id="company-section-title" class="font-semibold text-slate-700">Company details</h3>
        <div>
          <label id="label-company-name" for="companyName" class="block text-sm font-medium text-slate-700 mb-1">Company name *</label>
          <input type="text" id="companyName" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
        <div>
          <label id="label-company-number" for="companyNumber" class="block text-sm font-medium text-slate-700 mb-1">Company number *</label>
          <input type="text" id="companyNumber" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
        <div>
          <label id="label-company-contact" for="companyContactNumber" class="block text-sm font-medium text-slate-700 mb-1">Company contact number</label>
          <input type="tel" id="companyContactNumber" class="w-full border border-slate-300 rounded px-3 py-2 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
        <div>
          <label id="label-company-principal" for="companyPrincipalContact" class="block text-sm font-medium text-slate-700 mb-1">Principal contact</label>
          <input type="text" id="companyPrincipalContact" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
      </div>

      <button id="submit-btn" type="submit" class="w-full bg-amber-500 text-slate-900 font-semibold py-2 rounded hover:bg-amber-400 transition-[box-shadow,colors] duration-150">Save changes</button>
      <p id="profile-message" class="text-sm mt-2" role="status" aria-live="polite"></p>
    </form>

    <div id="danger-zone" class="hidden max-w-xl w-full mx-auto mt-8">
      <div class="rounded-xl border border-red-200 bg-red-50/90 p-6 space-y-4">
        <h3 id="danger-title" class="text-lg font-semibold text-red-900">Delete account</h3>
        <p id="danger-text" class="text-sm text-red-950/90 leading-relaxed"></p>
        <div id="delete-password-wrap">
          <label id="label-delete-password" for="delete-password" class="block text-sm font-medium text-slate-800 mb-1"></label>
          <input type="password" id="delete-password" autocomplete="current-password" class="w-full border border-slate-300 rounded px-3 py-2 bg-white" />
        </div>
        <div>
          <label id="label-delete-confirm" for="delete-confirm" class="block text-sm font-medium text-slate-800 mb-1"></label>
          <input type="text" id="delete-confirm" autocomplete="off" spellcheck="false" class="w-full border border-slate-300 rounded px-3 py-2 bg-white font-mono text-sm" placeholder="DELETE MY ACCOUNT" />
        </div>
        <button type="button" id="btn-delete-account" class="w-full py-2.5 rounded-lg font-semibold text-sm shadow-sm"></button>
        <p id="delete-message" class="text-sm min-h-[1.25rem]"></p>
      </div>
    </div>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/js/intlTelInput.min.js"></script>
  <script src="js/intl-phone.js"></script>

          'ورود شما بلافاصله غیرفعال می‌شود و جزئیات شخصی روی سفارش‌ها از سیستم ما حذف می‌شود. مبالغ برای سوابق نگه داشته می‌شود. پروفایل پس از یک سال به‌طور دائم حذف می‌شود. این عمل برگشت‌ناپذیر است.',
        labelDeletePassword: 'رمز عبور (در صورت ورود با ایمیل/رمز الزامی است)',
        labelDeleteConfirm: 'عبارت تأیید را دقیقاً وارد کنید',
        deletePhraseHint: 'دقیقاً بنویسید: DELETE MY ACCOUNT',
        btnDeleteAccount: 'حذف دائمی حساب من',
        deleteWrongPhrase: 'عبارت تأیید را دقیقاً مطابق نمونه وارد کنید.',
        deleteSuccess: 'حساب شما بسته شد. در حال انتقال…',
        deleteError: 'حذف حساب انجام نشد. دوباره تلاش کنید یا با پشتیبانی تماس بگیرید.',
        accountInactive: 'این حساب دیگر فعال نیست. دوباره وارد شوید یا حساب جدید بسازید.'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';
    let cachedMe = null;

    function phoneErrMsg(detail, tr) {
      if (!detail || detail.ok) return '';
      var k = intlPhoneMessageKey(detail.code);
      return tr[k] || tr.phoneErrorInvalid;
    }

    function applyPhonePlaceholders() {
      var tr = translations[currentLang];
      var m = document.getElementById('mobile');
      var l = document.getElementById('landline');
      var c = document.getElementById('companyContactNumber');
      if (m) m.placeholder = tr.phoneHintMobile || '';
      if (l) l.placeholder = tr.phoneHintLandline || '';
      if (c) c.placeholder = tr.phoneHintCompany || '';
    }

    function applyPageLanguage() {
      const t = translations[currentLang];
      const token = localStorage.getItem('token');
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('site-subtitle').textContent = t.siteSubtitle;
      document.getElementById('page-title').textContent = t.pageTitle;
      document.getElementById('nav-home').textContent = t.navHome;
      document.getElementById('nav-products').textContent = t.navProducts;
      const navBasketMobileLabel = document.getElementById('nav-basket-mobile-label');
      if (navBasketMobileLabel) navBasketMobileLabel.textContent = t.navBasket;
      const navBasketLabel = document.getElementById('nav-basket-label');
      if (navBasketLabel) navBasketLabel.textContent = t.navBasket;
      document.getElementById('nav-orders').textContent = t.navOrders;
      document.getElementById('nav-profile').textContent = t.navProfile;
      document.getElementById('nav-login').textContent = t.navLogin;
      document.getElementById('go-account').textContent = t.createAccount;
      document.getElementById('nav-logout').textContent = t.navLogout;
      document.getElementById('redirect-message').textContent = t.redirectMessage;
      document.getElementById('redirect-link').textContent = t.logIn;
      document.getElementById('loading-text').textContent = t.loadingProfile;
      document.getElementById('label-type').textContent = t.accountType;
      document.getElementById('label-firstname').textContent = t.labelFirstname;
      document.getElementById('label-surname').textContent = t.labelSurname;
      document.getElementById('label-dob').textContent = t.labelDob;
      document.getElementById('label-email').textContent = t.labelEmail;
      document.getElementById('email-hint').textContent = t.emailHint;
      document.getElementById('telegram-email-explain').textContent = t.telegramEmailExplain;
      document.getElementById('label-contact-email').textContent = t.labelContactEmail;
      if (cachedMe && cachedMe.canLinkEmail) {
        document.getElementById('contact-email-hint').textContent = t.contactEmailHintTelegram;
      } else {
        document.getElementById('contact-email-hint').textContent = t.contactEmailHint;
      }
      var lte = document.getElementById('link-email-title');
      var lti = document.getElementById('link-email-intro');
      if (lte) lte.textContent = t.linkEmailTitle;
      if (lti) lti.textContent = t.linkEmailIntro;
      var lle = document.getElementById('label-link-email');
      var llp = document.getElementById('label-link-password');
      var ll2 = document.getElementById('label-link-password2');
      if (lle) lle.textContent = t.labelLinkEmail;
      if (llp) llp.textContent = t.labelLinkPassword;
      if (ll2) ll2.textContent = t.labelLinkPassword2;
      var blep = document.getElementById('btn-link-email-password');
      if (blep) blep.textContent = t.linkEmailSubmit;
      document.getElementById('label-mobile').textContent = t.labelMobile;
      document.getElementById('label-landline').textContent = t.labelLandline;
      document.getElementById('label-bank').textContent = t.labelBank;
      document.getElementById('label-address').textContent = t.labelAddress;
      document.getElementById('company-section-title').textContent = t.companySectionTitle;
      document.getElementById('label-company-name').textContent = t.labelCompanyName;
      document.getElementById('label-company-number').textContent = t.labelCompanyNumber;
      document.getElementById('label-company-contact').textContent = t.labelCompanyContact;
      document.getElementById('label-company-principal').textContent = t.labelCompanyPrincipal;
      document.getElementById('submit-btn').textContent = t.saveChanges;
      if (PROFILE_DELETE_ACCOUNT_ENABLED) {
        var dt = document.getElementById('danger-title');
        if (dt) dt.textContent = t.dangerTitle;
        var dtx = document.getElementById('danger-text');
        if (dtx) dtx.textContent = t.dangerBody;
        var ldp = document.getElementById('label-delete-password');
        if (ldp) ldp.textContent = t.labelDeletePassword;
        var ldc = document.getElementById('label-delete-confirm');
        if (ldc) ldc.textContent = t.labelDeleteConfirm + ' — ' + t.deletePhraseHint;
        var bda = document.getElementById('btn-delete-account');
        if (bda) bda.textContent = t.btnDeleteAccount;
      }

      if (cachedMe) {
        const typeDisplay = document.getElementById('account-type-display');
        if (typeDisplay) typeDisplay.textContent = cachedMe.type === 'company' ? t.company : t.person;
      }

      document.getElementById('nav-login').classList.toggle('hidden', !!token);
      document.getElementById('go-account').classList.toggle('hidden', !!token);
      document.getElementById('nav-logout').classList.toggle('hidden', !token);

      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900 text-left sm:text-center'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors text-left sm:text-center';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900 text-left sm:text-center'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors text-left sm:text-center';
      if (typeof applyFooterI18n === 'function') applyFooterI18n();
      applyPhonePlaceholders();
    }

    function fillForm(me) {
      cachedMe = me;
      const typeDisplay = document.getElementById('account-type-display');
      const t = translations[currentLang];
      typeDisplay.textContent = me.type === 'company' ? t.company : t.person;
      document.getElementById('firstName').value = me.firstName || '';
      document.getElementById('surname').value = me.surname || '';
      document.getElementById('dob').value = me.dob ? String(me.dob).slice(0, 10) : '';
      document.getElementById('email').value = me.email || '';
      var tgExplain = document.getElementById('telegram-email-explain');
      if (tgExplain) {
        if (me.canLinkEmail) {
          tgExplain.classList.remove('hidden');
        } else {
          tgExplain.classList.add('hidden');
        }
      }
      var linkSetup = document.getElementById('link-email-setup');
      var contactEl = document.getElementById('contactEmail');
      if (me.canLinkEmail) {
        if (linkSetup) linkSetup.classList.remove('hidden');
        document.getElementById('label-contact-email').textContent = t.labelContactEmail;
        var ceh = document.getElementById('contact-email-hint');
        if (ceh) ceh.textContent = t.contactEmailHintTelegram;
        document.getElementById('linkRealEmail').value = '';
        document.getElementById('linkPassword').value = '';
        document.getElementById('linkPassword2').value = '';
        var lem = document.getElementById('link-email-message');
        if (lem) {
          lem.textContent = '';
          lem.className = 'text-sm min-h-[1.25rem]';
        }
      } else {
        if (linkSetup) linkSetup.classList.add('hidden');
        document.getElementById('label-contact-email').textContent = t.labelContactEmail;
        var ceh2 = document.getElementById('contact-email-hint');
        if (ceh2) ceh2.textContent = t.contactEmailHint;
      }
      if (contactEl) contactEl.required = true;
      document.getElementById('contactEmail').value = me.contactEmail || '';
      setIntlPhoneNumber(document.getElementById('mobile'), me.mobile || '');
      setIntlPhoneNumber(document.getElementById('landline'), me.landline || '');
      document.getElementById('bankDetails').value = me.bankDetails || '';
      document.getElementById('address').value = me.address || '';

      const companyEl = document.getElementById('company-fields');
      if (me.type === 'company') {
        companyEl.classList.remove('hidden');
        document.getElementById('companyName').value = me.companyName || '';
        document.getElementById('companyNumber').value = me.companyNumber || '';
        setIntlPhoneNumber(document.getElementById('companyContactNumber'), me.companyContactNumber || '');
        document.getElementById('companyPrincipalContact').value = me.companyPrincipalContact || '';
        document.getElementById('companyName').required = true;
        document.getElementById('companyNumber').required = true;
      } else {
        companyEl.classList.add('hidden');
        document.getElementById('companyName').required = false;
        document.getElementById('companyNumber').required = false;
      }
    }

    function buildPayload() {
      const meType = document.getElementById('company-fields').classList.contains('hidden') ? 'person' : 'company';
      const payload = {
        firstName: document.getElementById('firstName').value.trim(),
        surname: document.getElementById('surname').value.trim(),
        dob: document.getElementById('dob').value || null,
        contactEmail: (function () {
          var v = document.getElementById('contactEmail').value.trim();
          return v || null;
        })(),
        mobile: getIntlPhoneE164(document.getElementById('mobile')),
        landline: (function () {
          var v = getIntlPhoneE164(document.getElementById('landline'));
          return v || null;
        })(),
        bankDetails: document.getElementById('bankDetails').value.trim() || null,
        address: document.getElementById('address').value.trim()
      };
      if (meType === 'company') {
        payload.companyName = document.getElementById('companyName').value.trim();
        payload.companyNumber = document.getElementById('companyNumber').value.trim();
        var ccEl = document.getElementById('companyContactNumber');
        var cc = ccEl && ccEl.value && ccEl.value.trim() ? getIntlPhoneE164(ccEl) : '';
        payload.companyContactNumber = cc || null;
        const pc = document.getElementById('companyPrincipalContact').value.trim();
        payload.companyPrincipalContact = pc || null;
      }
      return payload;
    }

    async function loadProfile() {
      const token = localStorage.getItem('token');
      if (!token) {
        document.getElementById('profile-loading').classList.add('hidden');
        document.getElementById('profile-redirect').classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) {
          localStorage.removeItem('token');
          document.getElementById('profile-loading').classList.add('hidden');
          document.getElementById('profile-redirect').classList.remove('hidden');
          return;
        }
        if (res.status === 403) {
          localStorage.removeItem('token');
          document.getElementById('profile-loading').classList.add('hidden');
          document.getElementById('profile-redirect').classList.remove('hidden');
          document.getElementById('redirect-message').textContent = translations[currentLang].accountInactive;
          return;
        }
        if (!res.ok) throw new Error('load');
        const me = await res.json();
        document.getElementById('profile-loading').classList.add('hidden');
        document.getElementById('profile-form').classList.remove('hidden');
        if (PROFILE_DELETE_ACCOUNT_ENABLED) {
          document.getElementById('danger-zone').classList.remove('hidden');
        }
        fillForm(me);
        if (PROFILE_DELETE_ACCOUNT_ENABLED) {
          var delPw = document.getElementById('delete-password');
          var delCf = document.getElementById('delete-confirm');
          if (delPw) {
            delPw.value = '';
            delPw.required = true;
          }
          if (delCf) delCf.value = '';
          var pwWrap = document.getElementById('delete-password-wrap');
          if (pwWrap && me.hasPassword === false) {
            pwWrap.classList.add('opacity-80');
          } else if (pwWrap) {
            pwWrap.classList.remove('opacity-80');
          }
        }
      } catch (e) {
        document.getElementById('profile-loading').classList.add('hidden');
        document.getElementById('profile-redirect').classList.remove('hidden');
        document.getElementById('redirect-message').textContent = translations[currentLang].loadError;
      }
    }

    function profileSaveError(msg, text, focusEl) {
      msg.textContent = text;
      msg.className = 'text-sm mt-2 text-red-600';
      var submitBtn = document.getElementById('submit-btn');
      if (typeof window.setPrimaryButtonError === 'function' && submitBtn) {
        window.setPrimaryButtonError(submitBtn, true);
      }
      if (typeof window.scrollFeedbackIntoView === 'function') {
        window.scrollFeedbackIntoView(msg);
      }
      if (focusEl && typeof window.focusFieldNoScroll === 'function') {
        window.focusFieldNoScroll(focusEl);
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('profile-message');
      const submitBtn = document.getElementById('submit-btn');
      const t = translations[currentLang];
      const token = localStorage.getItem('token');
      if (!token) return;
      msg.textContent = '';
      msg.className = 'text-sm mt-2 text-slate-500';
      if (typeof window.setPrimaryButtonError === 'function' && submitBtn) {
        window.setPrimaryButtonError(submitBtn, false);
      }
      var mobileEl = document.getElementById('mobile');
      var mobileDetail = getIntlPhoneValidationDetail(mobileEl);
      if (!mobileDetail.ok) {
        profileSaveError(msg, phoneErrMsg(mobileDetail, t), mobileEl || undefined);
        return;
      }
      var landEl = document.getElementById('landline');
      var landDetail = getIntlPhoneValidationDetail(landEl, { optionalEmpty: true });
      if (!landDetail.ok) {
        profileSaveError(msg, phoneErrMsg(landDetail, t) || t.errorLandline, landEl || undefined);
        return;
      }
      var contactEmailEl = document.getElementById('contactEmail');
      var contactEmailVal = contactEmailEl && contactEmailEl.value.trim();
      if (!contactEmailVal) {
        profileSaveError(msg, t.errorContactEmail, contactEmailEl || undefined);
        return;
      }
      var meType = document.getElementById('company-fields').classList.contains('hidden') ? 'person' : 'company';
      if (meType === 'company') {
        var ccEl = document.getElementById('companyContactNumber');
        if (ccEl && ccEl.value.trim()) {
          var ccDetail = getIntlPhoneValidationDetail(ccEl);
          if (!ccDetail.ok) {
            profileSaveError(msg, phoneErrMsg(ccDetail, t), ccEl);
            return;
          }
        }
      }
      const payload = buildPayload();
      try {
        const res = await fetch('/api/me', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
          localStorage.removeItem('token');
          window.location.reload();
          return;
        }
        if (!res.ok) {
          const errText = (data && data.error) ? String(data.error) : t.saveError;
          profileSaveError(msg, errText);
          return;
        }
        msg.textContent = t.saved;
        msg.className = 'text-sm mt-2 text-emerald-600';
        if (typeof window.setPrimaryButtonError === 'function' && submitBtn) {
          window.setPrimaryButtonError(submitBtn, false);
        }
        if (typeof window.scrollFeedbackIntoView === 'function') {
          window.scrollFeedbackIntoView(msg);
        }
        fillForm(data);
      } catch (err) {
        profileSaveError(msg, t.saveError);
      }
    });

    document.getElementById('nav-logout').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    document.getElementById('lang-en').addEventListener('click', () => {
      currentLang = 'en';
      localStorage.setItem('lang', 'en');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });
    document.getElementById('lang-fa').addEventListener('click', () => {
      currentLang = 'fa';
      localStorage.setItem('lang', 'fa');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });

    document.getElementById('btn-link-email-password').addEventListener('click', async function () {
      const t = translations[currentLang];
      const msgEl = document.getElementById('link-email-message');
      const token = localStorage.getItem('token');
      if (!token) return;
      msgEl.textContent = '';
      msgEl.className = 'text-sm min-h-[1.25rem] text-slate-600';
      const email = document.getElementById('linkRealEmail').value.trim().toLowerCase();
      const p1 = document.getElementById('linkPassword').value;
      const p2 = document.getElementById('linkPassword2').value;
      if (!email) {
        msgEl.textContent = t.linkEmailError;
        msgEl.className = 'text-sm min-h-[1.25rem] text-red-600';
        if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
        return;
      }
      if (p1.length < 8) {
        msgEl.textContent = t.linkEmailShort;
        msgEl.className = 'text-sm min-h-[1.25rem] text-red-600';
        if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
        return;
      }
      if (p1 !== p2) {
        msgEl.textContent = t.linkEmailMismatch;
        msgEl.className = 'text-sm min-h-[1.25rem] text-red-600';
        if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
        return;
      }
      try {
        const res = await fetch('/api/auth/link-email-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + token
          },
          body: JSON.stringify({ email: email, password: p1 })
        });
        const data = await res.json().catch(function () {
          return {};
        });
        if (!res.ok) {
          msgEl.textContent = (data && data.error) ? String(data.error) : t.linkEmailError;
          msgEl.className = 'text-sm min-h-[1.25rem] text-red-600';
          if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
          return;
        }
        msgEl.textContent = t.linkEmailSuccess;
        msgEl.className = 'text-sm min-h-[1.25rem] text-emerald-600';
        if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
        document.getElementById('linkPassword').value = '';
        document.getElementById('linkPassword2').value = '';
        const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
        if (meRes.ok) {
          fillForm(await meRes.json());
        }
      } catch (e) {
        msgEl.textContent = t.linkEmailError;
        msgEl.className = 'text-sm min-h-[1.25rem] text-red-600';
        if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
      }
    });

    if (PROFILE_DELETE_ACCOUNT_ENABLED) {
      document.getElementById('btn-delete-account').addEventListener('click', async function () {
        const t = translations[currentLang];
        const token = localStorage.getItem('token');
        const msgEl = document.getElementById('delete-message');
        const phrase = (document.getElementById('delete-confirm') && document.getElementById('delete-confirm').value.trim()) || '';
        const pw = (document.getElementById('delete-password') && document.getElementById('delete-password').value) || '';
        if (phrase !== 'DELETE MY ACCOUNT') {
          msgEl.textContent = t.deleteWrongPhrase;
          msgEl.className = 'text-sm text-red-600';
          if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
          return;
        }
        if (!pw) {
          msgEl.textContent = t.deletePasswordRequired;
          msgEl.className = 'text-sm text-red-600';
          if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
          return;
        }
        if (!cachedMe || !cachedMe.hasPassword) {
          if (pw.length < 8) {
            msgEl.textContent = t.deletePasswordRequired;
            msgEl.className = 'text-sm text-red-600';
            if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
            return;
          }
        }
        msgEl.textContent = '';
        msgEl.className = 'text-sm min-h-[1.25rem] text-slate-500';
        try {
          const res = await fetch('/api/account/request-deletion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ password: pw, confirmPhrase: phrase })
          });
          const data = await res.json().catch(function () {
            return {};
          });
          if (!res.ok) {
            msgEl.textContent = (data && data.error) ? String(data.error) : t.deleteError;
            msgEl.className = 'text-sm text-red-600';
            if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
            return;
          }
          msgEl.textContent = t.deleteSuccess;
          msgEl.className = 'text-sm text-emerald-600';
          localStorage.removeItem('token');
          localStorage.removeItem('basket');
          setTimeout(function () {
            window.location.href = 'login.html';
          }, 1600);
        } catch (e) {
          msgEl.textContent = t.deleteError;
          msgEl.className = 'text-sm text-red-600';
          if (typeof window.scrollFeedbackIntoView === 'function') window.scrollFeedbackIntoView(msgEl);
        }
      });
    }

    applyPageLanguage();
    (async function () {
      try {
        await initIntlPhoneInputs('#mobile, #landline, #companyContactNumber');
        applyPhonePlaceholders();
      } catch (e) {
        console.error(e);
      }
      loadProfile();
    })();
    });
  </script>
</body>
</html>
