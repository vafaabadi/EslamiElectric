<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Products</title>
  <link rel="stylesheet" href="css/tailwind.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/mobile.css"></noscript>
  <link rel="stylesheet" href="css/mobile.css" media="print" onload="this.media='all'">
  <script src="/js/auth-nav-sync.js" defer></script>
  <script src="js/locale-bootstrap.js" defer></script>
  <script src="js/locale-init.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-lg sm:text-xl font-bold">Product admin</h1>
        <p class="text-slate-400 text-xs sm:text-sm">Sign in, then edit catalogue fields or upload a photo.</p>
      </div>
      <div class="flex flex-wrap gap-2 items-center">
        <a href="login.html" id="admin-goto-login" class="px-3 py-2 rounded-lg text-sm font-medium bg-amber-500 text-slate-900 hover:bg-amber-400">Log in</a>
        <a href="products.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-200 border border-slate-600 hover:bg-slate-700">View shop</a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
    <p id="admin-banner" class="hidden mb-4 rounded-xl border px-4 py-3 text-sm"></p>

    <section id="admin-gate" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-slate-700 text-sm">Use the shop login. Your email must be listed in <code class="text-xs bg-slate-100 px-1 rounded">ADMIN_ALLOWED_EMAILS</code> on the server.</p>
    </section>

    <section id="admin-panel" class="hidden space-y-6">
      <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <label for="admin-product-select" class="block text-sm font-medium text-slate-700 mb-2">Product</label>
        <select id="admin-product-select" class="w-full max-w-xl border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"></select>
        <p id="admin-source" class="mt-2 text-xs text-slate-500"></p>
      </div>

      <form id="admin-edit-form" class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="field-name" class="block text-xs font-medium text-slate-600 mb-1">Name (EN)</label>
            <input id="field-name" name="name" type="text" required maxlength="220" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label for="field-name-fa" class="block text-xs font-medium text-slate-600 mb-1">Name (FA)</label>
            <input id="field-name-fa" name="name_fa" type="text" maxlength="220" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" dir="rtl">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="field-price" class="block text-xs font-medium text-slate-600 mb-1">Price</label>
            <input id="field-price" name="price" type="number" step="0.01" min="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
          </div>
          <div>
            <label for="field-category" class="block text-xs font-medium text-slate-600 mb-1">Category</label>
            <select id="field-category" name="category_id" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white"></select>
          </div>
        </div>
        <div>
          <label for="field-desc" class="block text-xs font-medium text-slate-600 mb-1">Description</label>
          <textarea id="field-desc" name="description" rows="3" maxlength="4000" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="field-wattage" class="block text-xs font-medium text-slate-600 mb-1">Wattage (optional)</label>
            <input id="field-wattage" name="wattage" type="number" step="1" min="0" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="Leave empty if N/A">
          </div>
          <div>
            <label for="field-image-url" class="block text-xs font-medium text-slate-600 mb-1">Image URL (or upload below)</label>
            <input id="field-image-url" name="image_url" type="url" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm" placeholder="https://… or /images/…">
          </div>
        </div>
        <div class="flex flex-wrap gap-3 items-center">
          <button type="submit" class="px-4 py-2 rounded-lg bg-amber-500 text-slate-900 text-sm font-semibold hover:bg-amber-400 min-h-[44px]">Save changes</button>
          <label class="inline-flex items-center gap-2 text-sm text-slate-700 cursor-pointer">
            <span>Upload photo</span>
            <input id="field-image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="text-sm max-w-[12rem]">
          </label>
          <button type="button" id="admin-upload-btn" class="px-4 py-2 rounded-lg border border-slate-300 text-sm font-medium hover:bg-slate-50 min-h-[44px]">Upload image</button>
        </div>
        <div class="flex justify-center">
          <img id="admin-preview" alt="" class="max-h-48 rounded-lg border border-slate-200 hidden">
        </div>
      </form>
    </section>
  </main>
  <script src="js/admin-products-page.js" defer></script>
</body>
</html>
