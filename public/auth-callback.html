<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirming… - Lighting Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-md p-8 max-w-md text-center">
    <p id="status" class="text-slate-600">Confirming your email…</p>
    <p id="error" class="hidden mt-2 text-sm text-red-600"></p>
  </div>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.hash.slice(1));
      const accessToken = params.get('access_token');
      if (!accessToken) {
        document.getElementById('status').textContent = 'No confirmation data found. You can close this and log in.';
        setTimeout(function() { window.location.href = 'login.html'; }, 3000);
        return;
      }
      try {
        const configRes = await fetch('/api/config');
        const config = await configRes.json();
        if (!config.supabaseUrl || !config.supabaseAnonKey) {
          throw new Error('Config missing');
        }
        if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
          var supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
          if (supabase.auth && typeof supabase.auth.initialize === 'function') {
            await supabase.auth.initialize();
          }
        }
        const tokenRes = await fetch('/api/auth/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ accessToken: accessToken })
        });
        const data = await tokenRes.json().catch(function() { return {}; });
        if (tokenRes.ok && data.token) {
          localStorage.setItem('token', data.token);
          document.getElementById('status').textContent = 'Email confirmed. Taking you to the home page…';
          window.location.replace('index.html');
        } else {
          document.getElementById('status').textContent = 'Something went wrong.';
          var errMsg = data.error || '';
          if (errMsg.indexOf('Invalid or expired token') !== -1) {
            errMsg += ' Check that SUPABASE_JWT_SECRET in your server .env matches Supabase Project Settings → API → JWT Secret. You can also try logging in with your password.';
          }
          document.getElementById('error').textContent = errMsg;
          document.getElementById('error').classList.remove('hidden');
          setTimeout(function() { window.location.href = 'login.html'; }, 6000);
        }
      } catch (e) {
        document.getElementById('status').textContent = 'Something went wrong. Try logging in.';
        document.getElementById('error').textContent = e.message || '';
        document.getElementById('error').classList.remove('hidden');
        setTimeout(function() { window.location.href = 'login.html'; }, 4000);
      }
    })();
  </script>
</body>
</html>
