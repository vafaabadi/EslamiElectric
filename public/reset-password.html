<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/js/auth-nav-sync.js"></script>
  <title>Reset Password - Eslami Electric</title>
  <link rel="stylesheet" href="css/tailwind.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script src="js/locale-bootstrap.js"></script>
  <script src="js/price-format.js"></script>
  <script src="js/locale-init.js"></script>
  <script src="js/site-footer-i18n.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto">
        <a href="login.html" id="nav-login" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Log In</a>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors">فارسی</button>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js"></script>

  <main class="flex-grow max-w-md w-full mx-auto px-4 py-8">
    <h2 id="form-title" class="text-2xl font-bold text-slate-800 mb-6">Reset Password</h2>

    <p id="invalid-token-msg" class="hidden text-red-600 text-sm mb-4"><span id="invalid-msg-text"></span> <a href="forgot-password.html" id="invalid-msg-link" class="text-amber-600 underline"></a></p>

    <form id="reset-form" class="bg-white rounded-xl shadow-md p-6 space-y-4">
      <div>
        <label id="label-new-password" for="newPassword" class="block text-sm font-medium text-slate-700 mb-1">New Password *</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      <div>
        <label id="label-confirm-password" for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Confirm New Password *</label>
        <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>

      <button id="submit-btn" type="submit" class="w-full bg-amber-500 text-slate-900 font-semibold py-2 rounded hover:bg-amber-400 transition-colors">
        Set New Password
      </button>
      <p id="reset-message" class="text-sm mt-2"></p>
    </form>

    <p class="mt-6 text-center text-slate-600 text-sm">
      <a href="login.html" class="text-amber-600 font-medium hover:underline" id="back-login-label">Back to Log In</a>
    </p>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>

  <script>
    runWhenLocaleReady(function () {
    const translations = {
      en: {
        siteTitle: 'Eslami Electric',
        siteSubtitle: 'Quality electrical supplies',
        formTitle: 'Reset Password',
        labelNewPassword: 'New Password *',
        labelConfirmPassword: 'Confirm New Password *',
        submitBtn: 'Set New Password',
        backToLogin: 'Back to Log In',
        successMessage: 'Password has been reset. Redirecting to login...',
        errorPasswordShort: 'Password must be at least 8 characters',
        errorPasswordMismatch: 'Passwords do not match',
        errorInvalidTokenBefore: 'Invalid or expired reset link.',
        errorInvalidTokenLink: 'Request a new one',
        errorFailed: 'Failed to reset password. Please try again.'
      },
      fa: {
        siteTitle: 'الکتریکی اسلامی',
        siteSubtitle: 'تجهیزات برقی با کیفیت',
        formTitle: 'بازنشانی رمز عبور',
        labelNewPassword: 'رمز عبور جدید *',
        labelConfirmPassword: 'تکرار رمز عبور جدید *',
        submitBtn: 'تنظیم رمز عبور جدید',
        backToLogin: 'بازگشت به ورود',
        successMessage: 'رمز عبور بازنشانی شد. در حال انتقال به صفحه ورود...',
        errorPasswordShort: 'رمز عبور باید حداقل ۸ کاراکتر باشد',
        errorPasswordMismatch: 'رمز عبور و تکرار آن یکسان نیستند',
        errorInvalidTokenBefore: 'لینک بازنشانی نامعتبر یا منقضی است.',
        errorInvalidTokenLink: 'لینک جدید درخواست کنید',
        errorFailed: 'بازنشانی رمز عبور ناموفق بود. لطفاً دوباره تلاش کنید.'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const resetForm = document.getElementById('reset-form');
    const resetMessage = document.getElementById('reset-message');
    const invalidTokenMsg = document.getElementById('invalid-token-msg');
    const submitBtn = document.getElementById('submit-btn');

    function applyPageLanguage() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('site-subtitle').textContent = t.siteSubtitle;
      document.getElementById('form-title').textContent = t.formTitle;
      document.getElementById('label-new-password').textContent = t.labelNewPassword;
      document.getElementById('label-confirm-password').textContent = t.labelConfirmPassword;
      document.getElementById('submit-btn').textContent = t.submitBtn;
      document.getElementById('back-login-label').textContent = t.backToLogin;
      document.getElementById('nav-login').textContent = currentLang === 'fa' ? 'ورود' : 'Log In';

      document.getElementById('invalid-msg-text').textContent = t.errorInvalidTokenBefore + ' ';
      document.getElementById('invalid-msg-link').textContent = t.errorInvalidTokenLink;
      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      if (typeof applyFooterI18n === 'function') applyFooterI18n();
    }

    document.getElementById('lang-en').addEventListener('click', function() {
      currentLang = 'en';
      localStorage.setItem('lang', 'en');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });
    document.getElementById('lang-fa').addEventListener('click', function() {
      currentLang = 'fa';
      localStorage.setItem('lang', 'fa');
      localStorage.setItem('localePref', 'user');
      applyPageLanguage();
    });

    if (!token) {
      resetForm.classList.add('hidden');
      invalidTokenMsg.classList.remove('hidden');
      invalidTokenMsg.querySelector('a').href = 'forgot-password.html';
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      resetMessage.textContent = '';
      const t = translations[currentLang];

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        resetMessage.className = 'text-sm mt-2 text-red-600';
        resetMessage.textContent = t.errorPasswordShort;
        return;
      }
      if (newPassword !== confirmPassword) {
        resetMessage.className = 'text-sm mt-2 text-red-600';
        resetMessage.textContent = t.errorPasswordMismatch;
        return;
      }

      try {
        submitBtn.disabled = true;
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, confirmPassword })
        });

        const data = await res.json();

        if (!res.ok) {
          resetMessage.className = 'text-sm mt-2 text-red-600';
          resetMessage.textContent = data.error || t.errorFailed;
          return;
        }

        resetMessage.className = 'text-sm mt-2 text-emerald-600';
        resetMessage.textContent = t.successMessage;
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1500);
      } catch (err) {
        resetMessage.className = 'text-sm mt-2 text-red-600';
        resetMessage.textContent = t.errorFailed;
      } finally {
        submitBtn.disabled = false;
      }
    });

    applyPageLanguage();
    });
  </script>
</body>
</html>
