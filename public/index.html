<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lighting Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 id="site-title" class="text-2xl font-bold tracking-tight">Lighting Products</h1>
        <p id="site-subtitle" class="text-slate-400 text-sm">Quality electrical supplies</p>
      </div>
      <nav class="flex items-center gap-2" aria-label="Language and actions">
        <a href="products.html" id="nav-products" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Products</a>
        <a
          id="go-account"
          href="account.html"
          rel="noopener"
          class="px-3 py-1.5 rounded text-sm font-medium bg-emerald-500 text-slate-900 hover:bg-emerald-400 transition-colors"
        >
          Sign Up
        </a>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors">فارسی</button>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    <p id="loading" class="text-center text-slate-500">Loading products...</p>
    <p id="error" class="hidden text-center text-red-600"></p>
    <div id="product-grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-8 mt-auto">
    <div class="max-w-6xl mx-auto px-4">
      <h2 id="contact-title" class="text-lg font-semibold text-white mb-4">Contact Us</h2>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3 text-sm">
        <div>
          <p id="address-label" class="font-medium text-slate-400">Address</p>
          <p id="address-value">123 Electric Avenue, London, UK, EC1A 1BB</p>
        </div>
        <div>
          <p id="mobile-label" class="font-medium text-slate-400">Mobile</p>
          <p>+44 7700 900123</p>
          <p id="landline-label" class="font-medium text-slate-400 mt-2">Landline</p>
          <p>+44 20 7946 0958</p>
        </div>
        <div>
          <p id="social-label" class="font-medium text-slate-400">Social</p>
          <p>Telegram: <a href="https://t.me/lightingproducts" target="_blank" rel="noopener" class="text-amber-400 hover:underline">@lightingproducts</a></p>
          <p>Instagram: <a href="https://instagram.com/lightingproducts" target="_blank" rel="noopener" class="text-amber-400 hover:underline">@lightingproducts</a></p>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const translations = {
      en: {
        siteTitle: 'Lighting Products',
        siteSubtitle: 'Quality electrical supplies',
        loading: 'Loading products...',
        errorLoad: 'Failed to load products.',
        contactTitle: 'Contact Us',
        addressLabel: 'Address',
        addressValue: '123 Electric Avenue, London, UK, EC1A 1BB',
        mobileLabel: 'Mobile',
        landlineLabel: 'Landline',
        socialLabel: 'Social',
        navProducts: 'Products',
        createAccount: 'Sign Up',
        wattage: 'W'
      },
      fa: {
        siteTitle: 'محصولات روشنایی',
        siteSubtitle: 'تجهیزات برقی با کیفیت',
        loading: 'در حال بارگذاری محصولات...',
        errorLoad: 'بارگذاری محصولات ناموفق بود.',
        contactTitle: 'تماس با ما',
        addressLabel: 'آدرس',
        addressValue: '۱۲۳ خیابان الکتریک، لندن، انگلستان',
        mobileLabel: 'موبایل',
        landlineLabel: 'تلفن ثابت',
        socialLabel: 'شبکه‌های اجتماعی',
        navProducts: 'محصولات',
        createAccount: 'ایجاد حساب کاربری',
        wattage: 'وات'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';
    let productsData = [];

    const grid = document.getElementById('product-grid');
    const loading = document.getElementById('loading');
    const errorEl = document.getElementById('error');

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function applyLanguage() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';

      document.getElementById('site-title').textContent = t.siteTitle;
      document.getElementById('site-subtitle').textContent = t.siteSubtitle;
      loading.textContent = t.loading;
      document.getElementById('contact-title').textContent = t.contactTitle;
      document.getElementById('address-label').textContent = t.addressLabel;
      document.getElementById('address-value').textContent = t.addressValue;
      document.getElementById('mobile-label').textContent = t.mobileLabel;
      document.getElementById('landline-label').textContent = t.landlineLabel;
      document.getElementById('social-label').textContent = t.socialLabel;
      document.getElementById('nav-products').textContent = t.navProducts;
      document.getElementById('go-account').textContent = t.createAccount;

      document.getElementById('lang-en').className = currentLang === 'en'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';
      document.getElementById('lang-fa').className = currentLang === 'fa'
        ? 'px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900'
        : 'px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors';

      renderProducts();
    }

    function renderProducts() {
      grid.innerHTML = '';
      const t = translations[currentLang];
      productsData.forEach(p => {
        const name = currentLang === 'fa' && p.name_fa ? p.name_fa : p.name;
        const category = currentLang === 'fa' && p.category_fa ? p.category_fa : p.category;
        const wattageHtml = p.wattage != null
          ? `<p class="text-slate-500 text-sm mt-1">${p.wattage} ${t.wattage}</p>`
          : '';
        grid.insertAdjacentHTML('beforeend', `
          <article class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
            <div class="aspect-[4/3] bg-slate-200 overflow-hidden">
              <img src="${escapeHtml(p.image_url)}" alt="${escapeHtml(name)}" class="w-full h-full object-cover" loading="lazy">
            </div>
            <div class="p-4">
              <span class="text-xs font-medium text-amber-600 uppercase tracking-wider">${escapeHtml(category)}</span>
              <h2 class="text-lg font-semibold text-slate-800 mt-1">${escapeHtml(name)}</h2>
              ${wattageHtml}
              <p class="text-xl font-bold text-slate-900 mt-2">$${Number(p.price).toFixed(2)}</p>
            </div>
          </article>
        `);
      });
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        if (!res.ok) throw new Error('Request failed');
        productsData = await res.json();
        loading.classList.add('hidden');
        applyLanguage();
      } catch (err) {
        loading.classList.add('hidden');
        errorEl.textContent = translations[currentLang].errorLoad;
        errorEl.classList.remove('hidden');
      }
    }

    document.getElementById('lang-en').addEventListener('click', () => {
      currentLang = 'en';
      localStorage.setItem('lang', 'en');
      applyLanguage();
    });

    document.getElementById('lang-fa').addEventListener('click', () => {
      currentLang = 'fa';
      localStorage.setItem('lang', 'fa');
      applyLanguage();
    });

    loadProducts();
  </script>
</body>
</html>
