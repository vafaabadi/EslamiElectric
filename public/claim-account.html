<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim your account - Eslami Electric</title>
  <link rel="stylesheet" href="css/mobile.css">
  <style>html:not(.locale-ready) body{opacity:0}</style>
  <script src="js/locale-bootstrap.js"></script>
  <script src="js/price-format.js"></script>
  <script src="js/locale-init.js"></script>
  <script src="js/currency-toggle.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto">
        <a href="login.html" id="nav-login" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Log In</a>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js"></script>

  <main class="flex-grow max-w-md w-full mx-auto px-4 py-8">
    <h2 id="form-title" class="text-2xl font-bold text-slate-800 mb-2">Claim your account</h2>
    <p id="form-desc" class="text-slate-600 text-sm mb-6">Set a password to attach your order history to an account. You’ll then see your orders in My Orders.</p>

    <p id="invalid-msg" class="hidden text-red-600 text-sm mb-4"></p>

    <form id="claim-form" class="bg-white rounded-xl shadow-md p-6 space-y-4">
      <p id="email-hint" class="text-sm text-slate-600">Account for: <strong id="email-masked"></strong></p>
      <div>
        <label id="label-password" for="password" class="block text-sm font-medium text-slate-700 mb-1">Password *</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      <div>
        <label id="label-confirm" for="confirmPassword" class="block text-sm font-medium text-slate-700 mb-1">Confirm password *</label>
        <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
      </div>
      <button id="submit-btn" type="submit" class="w-full bg-amber-500 text-slate-900 font-semibold py-2 rounded hover:bg-amber-400 transition-colors">
        <span id="submit-text">Set password & claim account</span>
      </button>
      <p id="claim-message" class="text-sm mt-2"></p>
    </form>

    <p class="mt-6 text-center text-slate-600 text-sm">
      <a href="login.html" id="back-login" class="text-amber-600 font-medium hover:underline">Back to Log In</a>
    </p>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p>&copy; 2026 Eslami Electric. All rights reserved.</p>
    </div>
  </footer>

  <script>
    runWhenLocaleReady(function () {
    const translations = {
      en: {
        formTitle: 'Claim your account',
        formDesc: 'Set a password to attach your order history to an account. You’ll then see your orders in My Orders.',
        accountFor: 'Account for:',
        labelPassword: 'Password *',
        labelConfirm: 'Confirm password *',
        submitBtn: 'Set password & claim account',
        backLogin: 'Back to Log In',
        successMessage: 'Account claimed! Redirecting to My Orders...',
        errorPasswordShort: 'Password must be at least 8 characters',
        errorPasswordMismatch: 'Passwords do not match',
        errorInvalid: 'Invalid or expired link. Use the link from your order email.',
        errorFailed: 'Something went wrong. Please try again.'
      },
      fa: {
        formTitle: 'ادعای حساب کاربری',
        formDesc: 'یک رمز عبور تنظیم کنید تا سفارشات شما به یک حساب متصل شود. پس از آن سفارشات خود را در «سفارشات من» ببینید.',
        accountFor: 'حساب برای:',
        labelPassword: 'رمز عبور *',
        labelConfirm: 'تکرار رمز عبور *',
        submitBtn: 'تنظیم رمز و ادعای حساب',
        backLogin: 'بازگشت به ورود',
        successMessage: 'حساب ادعا شد. در حال انتقال به سفارشات من...',
        errorPasswordShort: 'رمز عبور باید حداقل ۸ کاراکتر باشد',
        errorPasswordMismatch: 'رمز عبور و تکرار آن یکسان نیستند',
        errorInvalid: 'لینک نامعتبر یا منقضی است. از لینک ایمیل سفارش استفاده کنید.',
        errorFailed: 'خطایی رخ داد. لطفاً دوباره تلاش کنید.'
      }
    };

    let currentLang = localStorage.getItem('lang') || 'en';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const claimForm = document.getElementById('claim-form');
    const claimMessage = document.getElementById('claim-message');
    const invalidMsg = document.getElementById('invalid-msg');
    const emailMasked = document.getElementById('email-masked');
    const submitBtn = document.getElementById('submit-btn');

    function applyPageLanguage() {
      const t = translations[currentLang];
      document.documentElement.lang = currentLang === 'fa' ? 'fa' : 'en';
      document.body.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
      document.getElementById('site-title').textContent = t.siteTitle || 'Eslami Electric';
      document.getElementById('site-subtitle').textContent = t.siteSubtitle || 'Quality electrical supplies';
      document.getElementById('form-title').textContent = t.formTitle;
      document.getElementById('form-desc').textContent = t.formDesc;
      document.getElementById('label-password').textContent = t.labelPassword;
      document.getElementById('label-confirm').textContent = t.labelConfirm;
      document.getElementById('submit-text').textContent = t.submitBtn;
      document.getElementById('back-login').textContent = t.backLogin;
      document.getElementById('nav-login').textContent = currentLang === 'fa' ? 'ورود' : 'Log In';
    }

    if (!token) {
      claimForm.classList.add('hidden');
      invalidMsg.classList.remove('hidden');
      invalidMsg.textContent = translations[currentLang].errorInvalid;
    } else {
      fetch('/api/claim-account/' + encodeURIComponent(token))
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data.valid && data.email) {
            emailMasked.textContent = data.email;
          } else {
            claimForm.classList.add('hidden');
            invalidMsg.classList.remove('hidden');
            invalidMsg.textContent = data.error || translations[currentLang].errorInvalid;
          }
        })
        .catch(function () {
          claimForm.classList.add('hidden');
          invalidMsg.classList.remove('hidden');
          invalidMsg.textContent = translations[currentLang].errorInvalid;
        });
    }

    claimForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      claimMessage.textContent = '';
      const t = translations[currentLang];
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        claimMessage.className = 'text-sm mt-2 text-red-600';
        claimMessage.textContent = t.errorPasswordShort;
        return;
      }
      if (password !== confirmPassword) {
        claimMessage.className = 'text-sm mt-2 text-red-600';
        claimMessage.textContent = t.errorPasswordMismatch;
        return;
      }

      submitBtn.disabled = true;
      try {
        const res = await fetch('/api/claim-account', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password, confirmPassword })
        });
        const data = await res.json().catch(function () { return {}; });

        if (!res.ok) {
          claimMessage.className = 'text-sm mt-2 text-red-600';
          claimMessage.textContent = data.error || t.errorFailed;
          return;
        }
        if (data.token) {
          localStorage.setItem('token', data.token);
        }
        claimMessage.className = 'text-sm mt-2 text-emerald-600';
        claimMessage.textContent = t.successMessage;
        setTimeout(function () {
          window.location.href = 'orders.html';
        }, 1500);
      } catch (err) {
        claimMessage.className = 'text-sm mt-2 text-red-600';
        claimMessage.textContent = t.errorFailed;
      } finally {
        submitBtn.disabled = false;
      }
    });

    applyPageLanguage();
    });
  </script>
</body>
</html>
