<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offline — Eslami Electric. Reconnect to browse electrical supplies.">
  <meta name="theme-color" content="#0f172a">
  <title>Offline — Eslami Electric</title>
  <link rel="stylesheet" href="/css/mobile.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/css/mobile.css"></noscript>
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; background: #f1f5f9; }
    .card { max-width: 24rem; background: #fff; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08); text-align: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.875rem; line-height: 1.5; margin-bottom: 1rem; }
    .fa { direction: rtl; font-family: system-ui, Tahoma, sans-serif; }
    a { display: inline-block; padding: 0.5rem 1rem; background: #f59e0b; color: #0f172a; font-weight: 600; border-radius: 0.5rem; text-decoration: none; }
    a:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You’re offline</h1>
    <p>Check your connection and try again. Saved pages may still open from your last visit.</p>
    <p class="fa">اینترنت در دسترس نیست. اتصال را بررسی کنید و دوباره تلاش کنید.</p>
    <p><a href="/">Try again</a></p>
  </div>
</body>
</html>
