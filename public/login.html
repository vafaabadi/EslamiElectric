<!DOCTYPE html>
<html lang="en">
<head>
  <!--SERVER_PUBLIC_CONFIG-->
  <script>
    (function () {
      try {
        var el = document.getElementById('server-public-config');
        if (el && el.textContent && String(el.textContent).trim()) return;
        var path = location.pathname || '';
        if (path !== '/login.html') return;
        var lang = typeof localStorage !== 'undefined' && localStorage.getItem('lang') === 'fa' ? 'fa' : 'en';
        location.replace('/' + lang + '/login.html' + location.search + location.hash);
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Eslami Electric</title>
  <link rel="stylesheet" href="css/tailwind.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="css/tailwind.css"><link rel="stylesheet" href="css/mobile.css"></noscript>
  <link rel="stylesheet" href="css/mobile.css" media="print" onload="this.media='all'">
  <script src="/js/auth-nav-sync.js" defer></script>
  <script src="js/locale-bootstrap.js" defer></script>
  <script src="js/price-format.js" defer></script>
  <script src="js/locale-init.js" defer></script>
  <script src="js/site-footer-i18n.js" defer></script>
  <script src="js/form-feedback.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <a href="index.html" class="hover:opacity-80 block truncate">
          <h1 id="site-title" class="text-xl sm:text-2xl font-bold tracking-tight truncate">Eslami Electric</h1>
          <p id="site-subtitle" class="text-slate-400 text-xs sm:text-sm truncate">Quality electrical supplies</p>
        </a>
      </div>
      <button type="button" id="nav-toggle" class="sm:hidden p-2 rounded-lg text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400 min-w-[44px] min-h-[44px] flex items-center justify-center" aria-label="Menu" aria-expanded="false">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <nav id="header-nav" class="hidden sm:flex flex-col sm:flex-row items-stretch sm:items-center gap-1 sm:gap-2 w-full sm:w-auto" aria-label="Language">
        <a href="account.html" id="nav-signup" class="px-3 py-1.5 rounded text-sm font-medium text-slate-200 hover:bg-slate-700 transition-colors">Sign Up</a>
        <button id="lang-en" type="button" class="px-3 py-1.5 rounded text-sm font-medium bg-amber-500 text-slate-900 text-left sm:text-center">English</button>
        <button id="lang-fa" type="button" class="px-3 py-1.5 rounded text-sm font-medium text-slate-300 hover:bg-slate-700 transition-colors text-left sm:text-center">فارسی</button>
      </nav>
    </div>
  </header>
  <script src="js/mobile-nav.js" defer></script>

  <main class="flex-grow max-w-md w-full mx-auto px-4 py-8">
    <h2 id="form-title" class="text-2xl font-bold text-slate-800 mb-1">Log In</h2>
    <p id="welcome-sub" class="text-slate-600 text-sm mb-3">Welcome to Eslami Electric</p>

    <div class="bg-white rounded-xl shadow-md p-6 space-y-5">
      <div id="social-stack" class="flex flex-col gap-3">
        <div id="wrap-google" class="order-1">
          <button type="button" id="btn-google" class="w-full flex items-center justify-center gap-2 min-h-[48px] px-4 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 font-medium hover:bg-slate-50 transition-colors shadow-sm">
            <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            <span id="btn-google-label">Continue with Google</span>
          </button>
        </div>
        <div id="wrap-telegram" class="order-2">
          <p id="telegram-domain-hint" class="hidden text-xs text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-center leading-snug"></p>
          <!-- dir=ltr: Telegram iframe is LTR; avoids broken layout on /fa/ RTL pages -->
          <div id="telegram-widget-host" dir="ltr" class="flex justify-center items-center min-h-[48px] w-full min-w-0 overflow-x-auto py-1"></div>
        </div>
      </div>

      <div class="relative flex items-center gap-3">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span id="divider-or" class="text-xs text-slate-400 uppercase tracking-wide">or</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <p id="login-message" class="text-sm min-h-[1.25rem] text-center" role="status" aria-live="polite"></p>

      <form id="login-form" class="space-y-4">
        <div>
          <label id="label-email" for="email" class="block text-sm font-medium text-slate-700 mb-1">Email *</label>
          <input type="email" id="email" required autocomplete="email" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>
        <div>
          <div class="flex items-center justify-between mb-1">
            <label id="label-password" for="password" class="block text-sm font-medium text-slate-700">Password *</label>
            <a href="forgot-password.html" id="link-forgot" class="text-sm text-amber-600 hover:underline">Forgot password?</a>
          </div>
          <input type="password" id="password" required autocomplete="current-password" class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>

        <button id="submit-btn" type="submit" class="w-full bg-amber-500 text-slate-900 font-semibold py-2 rounded hover:bg-amber-400 transition-[box-shadow,colors] duration-150">
          Log In
        </button>
      </form>

      <p id="no-account-block" class="pt-4 mt-2 border-t border-slate-100 text-center text-slate-600 text-sm">
        <span id="no-account-label">Don't have an account?</span>
        <a href="account.html" id="link-signup-main" class="text-amber-600 font-medium hover:underline">Sign Up</a>
      </p>
    </div>
  </main>

  <footer class="bg-slate-800 text-slate-300 py-6 mt-auto">
    <div class="max-w-6xl mx-auto px-4 text-center text-sm">
      <p data-i18n="footer-copyright"></p>
      <p data-i18n="footer-dev" class="text-xs text-slate-500 mt-2"></p>
    </div>
  </footer>

  
  <script defer src="js/login-page.js"></script>
</body>
</html>
