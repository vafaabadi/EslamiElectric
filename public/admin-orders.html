<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Orders &amp; audit</title>
  <link rel="stylesheet" href="/css/tailwind.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="/css/tailwind.css"><link rel="stylesheet" href="/css/mobile.css"></noscript>
  <link rel="stylesheet" href="/css/mobile.css" media="print" onload="this.media='all'">
  <script src="/js/auth-nav-sync.js" defer></script>
  <script src="/js/locale-bootstrap.js" defer></script>
  <script src="/js/locale-init.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col overflow-x-hidden">
  <header class="bg-slate-800 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-lg sm:text-xl font-bold">Orders &amp; audit</h1>
        <p class="text-slate-400 text-xs sm:text-sm">Track fulfillment and recent admin catalogue actions.</p>
      </div>
      <div class="flex flex-wrap gap-2 items-center">
        <a href="admin-products.html" class="px-3 py-2 rounded-lg text-sm font-medium bg-slate-700 border border-slate-500 hover:bg-slate-600">Catalog admin</a>
        <a href="login.html" id="admin-goto-login" class="px-3 py-2 rounded-lg text-sm font-medium bg-amber-500 text-slate-900 hover:bg-amber-400">Log in</a>
        <a href="products.html" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-200 border border-slate-600 hover:bg-slate-700">View shop</a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6 space-y-6">
    <p id="admin-orders-banner" class="hidden mb-2 rounded-xl border px-4 py-3 text-sm"></p>

    <section id="admin-orders-gate" class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
      <p class="text-slate-700 text-sm">Sign in with a shop admin account (<code class="text-xs bg-slate-100 px-1 rounded">is_admin</code>).</p>
    </section>

    <section id="admin-orders-panel" class="hidden space-y-6">
      <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm overflow-x-auto">
        <h2 class="text-sm font-semibold text-slate-800 mb-3">Recent orders</h2>
        <p id="admin-orders-empty" class="text-sm text-slate-600 hidden">No orders loaded.</p>
        <table class="min-w-full text-sm" id="admin-orders-table">
          <thead>
            <tr class="border-b border-slate-200 text-left text-xs uppercase text-slate-500">
              <th class="py-2 pr-3">When</th>
              <th class="py-2 pr-3">Order</th>
              <th class="py-2 pr-3">Total</th>
              <th class="py-2 pr-3">Fulfillment</th>
              <th class="py-2 pr-3">Customer</th>
              <th class="py-2 pr-3">Shipping</th>
              <th class="py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="admin-orders-tbody"></tbody>
        </table>
      </div>

      <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <h2 class="text-sm font-semibold text-slate-800 mb-3">Audit log (catalog)</h2>
        <p id="admin-audit-empty" class="text-sm text-slate-600 hidden">No audit rows.</p>
        <ul id="admin-audit-list" class="space-y-2 text-xs font-mono text-slate-700 max-h-[28rem] overflow-y-auto"></ul>
      </div>
    </section>
  </main>
  <script src="/js/admin-orders-page.js" defer></script>
</body>
</html>
