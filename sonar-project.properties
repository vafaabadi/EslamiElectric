# SonarCloud project configuration.
# Create your free account at https://sonarcloud.io, import the GitHub repo,
# then add a repository secret: SONAR_TOKEN (generated in SonarCloud → My Account → Security).
# The organization key below must match your SonarCloud organisation slug.

sonar.projectKey=vafaabadi_EslamiElectric
sonar.organization=vafaabadi
sonar.projectName=Eslami Electric
sonar.projectVersion=1.0

# ── Source paths ─────────────────────────────────────────────────────────────
# Server-side JS, client-side JS bundles, and any shared lib code.
sonar.sources=server.js,public/js,lib,config,src

# ── Test paths ────────────────────────────────────────────────────────────────
sonar.tests=tests
sonar.test.inclusions=tests/**/*.spec.ts,tests/**/*.test.ts,tests/**/*.spec.js

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  node_modules/**,\
  public/js/vendor/**,\
  coverage/**,\
  playwright-report/**,\
  test-results/**,\
  lighthouse-reports/**,\
  supabase/migrations/**,\
  **/*.min.js

# ── Language / encoding ────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Coverage (uncomment when you add a Jest/Vitest coverage reporter) ─────────
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
